.trial-panel-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:10px; }
.trial-log { display:flex; flex-direction:column; gap:3px; margin-bottom:10px; }
.trial-log-row { display:flex; align-items:center; gap:7px; font-size:11px; padding:2px 0; color:var(--muted2); }
.trial-log-ok   { color:var(--green); }
.trial-log-fail { color:var(--red); }
.trial-verdict-badge { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; font-size:12px; font-weight:700; }
.trial-verdict-badge.ready        { background:rgba(16,185,129,.15); color:var(--green); }
.trial-verdict-badge.needs_review { background:rgba(245,158,11,.15);  color:var(--amber); }
.trial-verdict-badge.blocked      { background:rgba(239,68,68,.15);   color:var(--red); }
.crl-run-btn { width:100%; padding:9px; border-radius:7px; background:var(--s3); border:1px solid var(--border); color:var(--text); font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; }
.crl-run-btn:hover:not(:disabled) { border-color:var(--accent2); color:var(--accent2); }
.crl-run-btn:disabled { opacity:.4; cursor:not-allowed; }
.crl-deploy-section { display:flex; flex-direction:column; gap:5px; }
.crl-deploy-target { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px; border:1px solid var(--border); font-size:11px; }
.crl-deploy-target.open    { border-color:rgba(16,185,129,.3); background:rgba(16,185,129,.04); }
.crl-deploy-target.blocked { opacity:.5; }
.crl-deploy-target-name { flex:1; font-weight:600; color:var(--text); }
.crl-deploy-target-btn { font-size:10px; padding:3px 10px; border-radius:4px; cursor:pointer; font-weight:700; border:none; transition:opacity .15s; }
.crl-deploy-target-btn.open    { background:var(--accent); color:#fff; }
.crl-deploy-target-btn.blocked { background:var(--s3); color:var(--muted2); cursor:not-allowed; }
.crl-deploy-target-btn.warn    { background:rgba(245,158,11,.2); color:var(--amber); }
.cf-readiness-btn { width:100%; padding:9px; border-radius:7px; background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(96,165,250,.12)); border:1px solid rgba(124,58,237,.35); color:var(--accent2); font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; text-align:center; }
.cf-readiness-btn:hover { border-color:var(--accent2); }
.cf-readiness-compact { display:flex; flex-direction:column; gap:5px; }
.cf-readiness-compact-row { display:flex; align-items:center; gap:6px; font-size:11px; padding:4px 8px; border-radius:5px; background:var(--s2); color:var(--muted); }
.cf-readiness-compact-row strong { color:var(--text); margin-left:auto; font-family:var(--mono); }
</style>
</head>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const SOMA_BASE = window.__SOMA_BASE_URL || localStorage.getItem('pulse_soma_url') || '';

// ══════════════════════════════════════════════════════════════════════════════
// SOMA ADAPTER — remaps SOMA API calls to SOMA endpoints + normalises shapes
// ══════════════════════════════════════════════════════════════════════════════
(function() {
  var _origFetch = window.fetch.bind(window);

  var REMAP = {
    '/api/chat':               '/api/soma/chat',
    '/api/swarm':              '/api/soma/swarm/deploy',
    '/api/debate':             '/api/soma/swarm/debate',
    '/api/goals':              '/api/soma/goals',
    '/api/status':             '/api/soma/boot-health',
    '/api/me':                 '/api/soma/ready',
    '/health':                 '/api/soma/ready',
    '/api/graph':              '/api/soma/knowledge/graph',
    '/api/files/tree':         '/api/pulse/fs/list-tree',
    '/api/files/raw':          '/api/pulse/fs/raw',
    '/api/tools/file/read':    '/api/pulse/fs/read-file',
    '/api/tools/file/write':   '/api/pulse/fs/write-file',
    '/api/tools/shell/run':    '/api/pulse/shell/execute',
    '/api/tools/shell/start':  '/api/pulse/shell/execute',
    '/api/usage':              'STUB',
    '/api/persona':            'STUB',
    '/api/config':             'STUB',
    '/api/clear':              'STUB',
  };

  function getPath(url) {
    try {
      var s = typeof url === 'string' ? url : String(url);
      return s.replace(/^https?:\/\/[^/]+/, '').split('?')[0];
    } catch(e) { return ''; }
  }

  function somaPath(url) {
    var path = getPath(url);
    if (/^\/api\/goals\/.+/.test(path)) return path.replace('/api/goals/', '/api/soma/goals/');
    var mapped = REMAP[path];
    return mapped !== undefined ? mapped : null; // null = pass through unchanged
  }

  function transformBody(dest, method, body) {
    if (!body || method === 'GET') return body;
    try {
      var b = JSON.parse(body);
      if (dest === '/api/soma/chat')
        return JSON.stringify({ message: b.message, history: [], sessionId: 'pulse-ide' });
      if (dest === '/api/soma/fs/read')
        return JSON.stringify({ path: b.filePath || b.path });
      if (dest === '/api/soma/fs/operate')
        return JSON.stringify({ operation: 'write', sourcePath: b.filePath || b.path, path: b.filePath || b.path, content: b.content || '' });
      if (dest === '/api/soma/shell/exec' || dest === '/api/pulse/shell/execute')
        return JSON.stringify({ command: b.command });
      if (dest === '/api/soma/swarm/deploy')
        return JSON.stringify({ task: b.task || b.message || b.topic || '' });
      if (dest === '/api/soma/swarm/debate')
        return JSON.stringify({ topic: b.topic || b.message || b.task || '' });
      return body;
    } catch(e) { return body; }
  }

  function makeResponse(data, status) {
    return new Response(JSON.stringify(data), {
      status: status || 200,
      headers: { 'Content-Type': 'application/json' }
    });
  }

  async function transformResponse(dest, res) {
    var data;
    try { data = await res.json(); } catch(e) { return res; }

    var basePath = dest.split('?')[0];

    if (basePath === '/api/soma/goals') {
      var arr = Array.isArray(data) ? data : (data.goals || data.activeGoals || []);
      return makeResponse(arr, res.status);
    }
    if (basePath === '/api/soma/boot-health') {
      return makeResponse({
        drive:  { tension: 0.6 },
        memory: { totalMemories: (data.goals && data.goals.total) || 0 },
        brain: {
          smart: { backend: (data.core && data.core.quadBrain) ? 'deepseek' : 'initializing' },
          fast:  { backend: 'ollama' }
        },
        cwd:         '.',
        uptime:      data.uptime,
        activeGoals: data.goals && data.goals.active,
        heapUsedMB:  data.memory && data.memory.heapUsedMB,
      }, res.status);
    }
    if (basePath === '/api/soma/ready') {
      return makeResponse({ ok: true, key: 'soma-pulse' }, res.status);
    }
    if (basePath === '/api/soma/chat') {
      var reply = data.response || data.reply || data.message || '';
      return makeResponse({ reply: reply, response: reply, result: reply, success: data.success }, res.status);
    }
    if (basePath === '/api/soma/swarm/deploy' || basePath === '/api/soma/swarm/debate') {
      var r = data.result || data.synthesis || data.response || data.reply || JSON.stringify(data);
      return makeResponse({ reply: r, response: r, result: r, synthesis: r }, res.status);
    }
    if (basePath === '/api/soma/fs/read' || basePath === '/api/pulse/fs/read-file') {
      var content = data.content || data.result || '';
      return makeResponse({ result: content, content: content, success: data.success }, res.status);
    }
    if (basePath === '/api/soma/shell/exec' || basePath === '/api/pulse/shell/execute') {
      var output = data.output || data.stdout || data.error || '';
      return makeResponse({ stdout: output, output: output, result: output, success: data.success, cwd: data.cwd, code: data.code }, res.status);
    }
    // knowledge/graph and others pass through
    return makeResponse(data, res.status);
  }

  window.fetch = async function(url, opts) {
    opts = opts || {};
    var urlStr = typeof url === 'string' ? url : String(url);
    // Never intercept external calls (CDN, fonts, Ollama, etc.)
    if (/^https?:/.test(urlStr) && !urlStr.includes('localhost:3100') && !urlStr.includes('localhost:3001')) {
      return _origFetch(url, opts);
    }

    var dest = somaPath(urlStr);

    // Unmapped: pass through with host stripped
    if (dest === null) {
      var stripped = urlStr.replace(/^https?:\/\/[^/]+/, '');
      return _origFetch(stripped, opts);
    }

    // Stubs
    if (dest === 'STUB')      return makeResponse({ ok: true });
    if (dest === 'STUB_TREE') return makeResponse({ files: [] });

    // Preserve query strings for remapped GET routes
    var queryIdx = urlStr.indexOf('?');
    if (queryIdx !== -1) {
      dest += urlStr.substring(queryIdx);
    }

    var method = (opts.method || 'GET').toUpperCase();
    var newHeaders = Object.assign({}, opts.headers || {});
    delete newHeaders['X-Api-Key'];
    if (method !== 'GET') newHeaders['Content-Type'] = 'application/json';

    var newOpts = Object.assign({}, opts, {
      headers: newHeaders,
      body:    transformBody(dest, method, opts.body)
    });

    try {
      var res = await _origFetch(dest, newOpts);
      return transformResponse(dest, res);
    } catch(err) {
      console.warn('[Pulse] fetch error:', dest, err.message);
      throw err;
    }
  };

  // ── SOMA Socket.io — live events ─────────────────────────────────────────
  function connectSomaSocket() {
    if (typeof io === 'undefined') { setTimeout(connectSomaSocket, 2000); return; }
    try {
      var sock = io('/', { transports: ['websocket', 'polling'], reconnectionDelay: 2000 });
      sock.on('connect',    function() { console.log('[Pulse] SOMA socket live'); });
      sock.on('disconnect', function() { console.warn('[Pulse] SOMA socket disconnected'); });
      var RELAY = ['dashboard_state', 'thought', 'arbiter_message', 'goal_created', 'goal_completed'];
      RELAY.forEach(function(ev) {
        sock.on(ev, function(d) {
          window.dispatchEvent(new CustomEvent('soma:event', { detail: Object.assign({ type: ev }, d) }));
        });
      });
      window.__somaSocket = sock;
    } catch(e) { console.warn('[Pulse] Socket.io error:', e.message); }
  }
  window.addEventListener('load', connectSomaSocket);
})();
// ══════════════════════════════════════════════════════════════════════════════


// Collision-proof message ID: prefix + timestamp + incrementing counter
let _msgSeq = 0;
const nextMsgId = () => `m${Date.now()}_${++_msgSeq}`;

// Auth headers — uses injected key (server-side) or stored key (localStorage)
// Pass noContentType=true for GET requests
function authHdrs(noContentType = false) {
  const key = window.__SOMA_API_KEY || localStorage.getItem('pulse_api_key') || '';
  const h = {};
  if (!noContentType) h['Content-Type'] = 'application/json';
  if (key) h['X-Api-Key'] = key;
  return h;
}

function Icon({ name, size }) {
  const el = ICONS[name];
  if (!el) return null;
  if (!size) return el;
  return React.cloneElement(el, { width:size, height:size });
}

function fileIcon(name) {
  const ext = name.split('.').pop();
  if (['ts','tsx'].includes(ext)) return ICONS.ts;
  if (ext === 'json') return ICONS.json;
  if (ext === 'md')   return ICONS.md;
  if (name === 'package.json') return ICONS.pkg;
  if (ext === 'env')  return ICONS.key;
  return ICONS.file;
}

// ── Syntax highlighting ───────────────────────────────────────
function syntaxHL(code, lang) {
  lang = lang || '';
  var esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var jsLangs = ['ts','tsx','js','jsx','typescript','javascript'];
  if (jsLangs.indexOf(lang) !== -1) {
    var src = esc, out = '', i = 0;
    var KWS = 'const,let,var,function,class,return,import,export,from,if,else,for,while,async,await,new,typeof,interface,type,extends,implements,null,undefined,true,false,void,enum,readonly,public,private,protected,static,abstract'.split(',');
    while (i < src.length) {
      var ch = src[i];
      if (ch==='/' && src[i+1]==='/') {
        var e1=src.indexOf('\n',i); if(e1<0) e1=src.length;
        out+='<span class="t-cmt">'+src.slice(i,e1)+'</span>'; i=e1; continue;
      }
      if (ch==='/' && src[i+1]==='*') {
        var e2=src.indexOf('*/',i+2); if(e2<0) e2=src.length-2;
        out+='<span class="t-cmt">'+src.slice(i,e2+2)+'</span>'; i=e2+2; continue;
      }
      if (ch==='"') {
        var j=i+1; while(j<src.length && src[j]!=='"'){if(src[j]==='\\'){j+=2;}else{j++;}} j++;
        out+='<span class="t-str">'+src.slice(i,j)+'</span>'; i=j; continue;
      }
      if (ch==="'") {
        var k=i+1; while(k<src.length && src[k]!=="'"){if(src[k]==='\\'){k+=2;}else{k++;}} k++;
        out+='<span class="t-str">'+src.slice(i,k)+'</span>'; i=k; continue;
      }
      var prev = i>0 && /[a-zA-Z0-9_$]/.test(src[i-1]);
      if (!prev && /[a-zA-Z_$]/.test(ch)) {
        var m=i; while(m<src.length && /[a-zA-Z0-9_$]/.test(src[m])) m++;
        var next = m<src.length && /[a-zA-Z0-9_$]/.test(src[m]);
        var word=src.slice(i,m);
        if (!next && KWS.indexOf(word)!==-1) { out+='<span class="t-kw">'+word+'</span>'; i=m; continue; }
        if (!next && /^[A-Z]/.test(word)) { out+='<span class="t-type">'+word+'</span>'; i=m; continue; }
        out+=word; i=m; continue;
      }
      if (/[0-9]/.test(ch) && (i===0||!/[a-zA-Z_$]/.test(src[i-1]))) {
        var n=i; while(n<src.length && /[0-9.]/.test(src[n])) n++;
        out+='<span class="t-num">'+src.slice(i,n)+'</span>'; i=n; continue;
      }
      out+=ch; i++;
    }
    return out;
  }
  if (lang==='json') {
    return esc
      .replace(/"([^"\\]|\\.)*"(\s*):/g,function(m){var ci=m.lastIndexOf('"')+1;return '<span class="t-prop">'+m.slice(0,ci)+'</span>'+m.slice(ci);})
      .replace(/"([^"\\]|\\.)*"/g,function(m){return '<span class="t-str">'+m+'</span>';})
      .replace(/\b(true|false|null)\b/g,'<span class="t-kw">$1</span>')
      .replace(/\b(\d+\.?\d*)\b/g,'<span class="t-num">$1</span>');
  }
  return esc;
}

function ToolCallBlock({ line, state }) {
  const m = line.match(/^TOOL:([^:]+):([^:]+)(?::(.+))?$/);
  if (!m) return null;
  const [, toolName, action, rawParams] = m;
  const meta = TOOL_META[`${toolName}:${action}`] || { icon:'⚙', verb:action, color:'var(--muted)' };
  let paramText = '';
  let filePath = '';
  if (rawParams) {
    try {
      const p = JSON.parse(rawParams);
      filePath = p.filePath || p.path || '';
      paramText = filePath || p.command || p.query || p.title || p.url || String(Object.values(p)[0]||'');
    } catch { paramText = rawParams.slice(0,80); }
  }
  const isRunning = state === 'running';
  const isFileOp = toolName==='file' && ['read','write','replace'].includes(action) && filePath;
  const handleClick = isFileOp ? ()=>{
    const fp = filePath.replace(/\\/g,'/');
    const name = fp.split('/').pop();
    window.maxOpenFile?.({name, path:fp});
  } : undefined;
  return (
    <div className={`tcb ${isRunning?'tcb-running':state==='error'?'tcb-error':'tcb-done'}`}
      onClick={handleClick} style={isFileOp?{cursor:'pointer'}:{}}>
      <span className="tcb-icon">{meta.icon}</span>

function MdBlock({ text }) {
  const parts = text.split(/(```(?:\w+)?\n[\s\S]*?```)/g);
  return (
    <>
      {parts.map((part, i) => {
        const m = part.match(/^```(\w*)\n([\s\S]*)```$/);
        if (m) return (
          <pre key={i} style={{marginTop:6,marginBottom:6}}>
            <code dangerouslySetInnerHTML={{ __html: syntaxHL(m[2], m[1]) }} />
          </pre>
        );
        const html = part
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/\*(.+?)\*/g,'<em>$1</em>')
          .replace(/`([^`\n]+)`/g,'<code>$1</code>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent2)">$1</a>')
          .replace(/^### (.+)$/gm,'<h4 style="margin:8px 0 2px;font-size:12px;color:var(--text)">$1</h4>')
          .replace(/^## (.+)$/gm,'<h3 style="margin:8px 0 3px;font-size:13px;font-weight:600">$1</h3>')
          .replace(/^# (.+)$/gm,'<h2 style="margin:8px 0 4px;font-size:14px;font-weight:700">$1</h2>')
          .replace(/^(\d+\.) (.+)$/gm,'<li data-ol>$2</li>')
          .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
          .replace(/(<li[^>]*>[\s\S]*?<\/li>(\n|$))+/g, s => {
            const isOl = s.includes('data-ol');
            const tag = isOl ? 'ol' : 'ul';
            const items = s.replace(/ data-ol/g,'');
            return `<${tag} style="margin:4px 0 4px 16px;padding:0">${items}</${tag}>`;
          })
          .replace(/\n{2,}/g,'<br/><br/>')
          .replace(/\n/g,'<br/>');
        return <div key={i} dangerouslySetInnerHTML={{ __html: html }} />;
      })}
    </>
  );
}

function MdContent({ text, isStreaming }) {
  // Waiting for first token — show pulse dots inside the bubble
  if (isStreaming && !text) {
    return <div className="thinking-dots" style={{padding:'4px 2px'}}><span/><span/><span/></div>;
  }
  const lines = (text||'').split('\n');
  const segments = [];
  let buf = [];
  for (const line of lines) {
    if (/^TOOL:[a-zA-Z_]+:[a-zA-Z_]+/.test(line.trim())) {
      if (buf.length) { segments.push({ type:'text', content:buf.join('\n') }); buf=[]; }
      segments.push({ type:'tool', line:line.trim() });
    } else { buf.push(line); }
  }
  if (buf.length) segments.push({ type:'text', content:buf.join('\n') });
  const lastToolIdx = segments.reduce((acc,s,i)=>s.type==='tool'?i:acc,-1);
  return (
    <>
      {segments.map((seg,i)=>{
        if (seg.type==='tool') {
          const state = isStreaming && i===lastToolIdx ? 'running' : 'done';
          return <ToolCallBlock key={i} line={seg.line} state={state}/>;
        }
        return seg.content.trim() ? <MdBlock key={i} text={seg.content}/> : null;
      })}
      {isStreaming && <span className="typing-cursor"/>}
    </>
  );
}

// ── Tool chip ─────────────────────────────────────────────────
function ToolChip({ t, pendingChanges, setPendingChanges, setActiveTab, onAcceptPending, onRejectPending }) {
  const ic = t.icon === 'write' ? ICONS.file : ICONS.terminal;
  const isWrite = t.icon === 'write';
  const pending = isWrite ? pendingChanges.find(p => p.file === t.label || p.file === ('src/'+t.label)) : null;
  const status = pending?.status;

  const accept = (e) => {
    e.stopPropagation();
    if (!pending) return;
    if (onAcceptPending) onAcceptPending(pending);
  };
  const reject = (e) => {
    e.stopPropagation();
    if (onRejectPending && pending) onRejectPending(pending);
  };

  return (
    <div className="tool-call" style={status==='rejected'?{opacity:.45}:{}}>
      <span className="tc-icon" style={{display:'flex',alignItems:'center'}}>{ic}</span>
      <span style={{color:'var(--muted)',fontSize:10,letterSpacing:.5,textTransform:'uppercase'}}>{t.action}</span>
      <span className="tc-path">{t.label}</span>
      {isWrite && !status && t.ok && <span className="tc-ok" style={{display:'flex',alignItems:'center'}}>{ICONS.check}</span>}
      {isWrite && status === 'pending' && (
        <div className="tc-actions">
          <button className="tc-accept" title="View diff" onClick={e=>{
            e.stopPropagation();
            const fname = t.label.split('/').pop();
            if(setActiveTab) setActiveTab(fname);
          }} style={{fontSize:10,width:'auto',padding:'0 5px',color:'var(--blue)',background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.3)'}}>diff</button>
          <button className="tc-accept" title="Accept change" onClick={accept}>{ICONS.check}</button>
          <button className="tc-reject" title="Reject change" onClick={reject}>{ICONS.close}</button>
        </div>
      )}
      {isWrite && status === 'accepted' && <span className="tc-accepted">{ICONS.check} accepted</span>}
      {isWrite && status === 'rejected' && <span className="tc-rejected">rejected</span>}
      {!isWrite && <span className="tc-ok" style={{display:'flex',alignItems:'center'}}>{ICONS.check}</span>}
    </div>
  );
}

  const generateGmnSite = async () => {

  const critFails = (res) => CRL_STAGES.flatMap(s=>s.checks).filter(c=>c.critical&&res[c.id]==='fail').map(c=>c.id);

        if (verified) { pp=Math.min(pp+0.04,0.97); wp=Math.max(wp-0.02,0.02); }
        const rv=Math.random();
        setCrlResults(prev=>({...prev,[check.id]:rv<pp?'pass':rv<pp+wp?'warn':'fail'}));
      }
    }
    setCrlActive(null); setCrlDone(true); setCrlRunning(false);
  };

  const runTrial = async () => {
    setTrialState('running'); setTrialLog([]);
    for (const step of TRIAL_STEPS) {
      await new Promise(r => setTimeout(r, 460 + Math.random() * 640));
      setTrialLog(prev => [...prev, { label:step, ok:Math.random()>0.08 }]);
    }
    const cf=critFails(crlResults);
    const fails=Object.values(crlResults).filter(v=>v==='fail').length;
    const warns=Object.values(crlResults).filter(v=>v==='warn').length;
    setTrialState(cf.length>0||fails>3?'blocked':warns>4||fails>0?'needs_review':'ready');
  };

  const deployToTarget = (targetId) => {
    if (!manifest) return;
    const sc=crlScore(crlResults);

  };

  const deployConstruct = () => {

            onChange={e => setForm(f => ({...f, prompt:e.target.value}))} />

  // ── MANIFEST ──
  if (phase === 'manifest' && manifest) {
    const t = CONSTRUCT_TYPES.find(x => x.id === manifest.type) || CONSTRUCT_TYPES[8];
    const score = calcScore(certState);
    const certDone = Object.keys(certState).length === CERT_CHECKS.length;
    const constructId = manifest.constructId || makeConstructId(manifest);
    return (
      <div className="cf-root">
        <div className="cf-header">
          <button className="cf-back-btn" onClick={() => { setPhase(selectedType && manifest.createdAt === null ? 'build' : 'home'); setManifest(null); setCertState({}); }}>← Back</button>
          <span style={{color:t.color,display:'flex',alignItems:'center'}}>{ICONS[t.icon] ? <Icon name={t.icon} size={18} /> : <span style={{fontSize:18}}>{t.icon}</span>}</span>
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <div className="cf-title">{manifest.name}</div>
              <span className="cf-version-badge">v{manifest.version}</span>
              {score != null && <span className={`cf-score-badge ${score>=80?'good':score>=50?'warn':'bad'}`}>Certified {score}/100</span>}
            </div>
            <div className="cf-construct-id">{constructId}</div>
          </div>
          <div style={{display:'flex',gap:6,flexShrink:0}}>
            <button className="cf-action-btn" onClick={() => startEdit(manifest)}>Edit</button>
            <button className="cf-action-btn" onClick={() => exportManifest(manifest)}>Export JSON</button>
          </div>
        </div>
        <div className="cf-manifest-layout">
          <div className="cf-manifest-left">
            <div className="cf-section">
              <div className="cf-section-title">Description</div>
              <div className="cf-section-body">{manifest.description}</div>
            </div>
            <div className="cf-section">
              <div className="cf-section-title">Components</div>
              <div className="cf-comp-group">
                <div className="cf-comp-label">Required</div>
                <div className="cf-chips">{(manifest.components?.required||[]).map(c=><span key={c} className="cf-chip cf-chip-req">{c}</span>)}</div>
              </div>
              <div className="cf-comp-group">
                <div className="cf-comp-label">Optional</div>
                <div className="cf-chips">{(manifest.components?.optional||[]).map(c=><span key={c} className="cf-chip">{c}</span>)}</div>
              </div>
            </div>
            <div className="cf-section">
              <div className="cf-section-title">Permissions</div>
              <div className="cf-chips">{(manifest.permissions||[]).map(p=><span key={p} className="cf-chip cf-chip-perm">{p}</span>)}</div>
            </div>
            <div className="cf-section">
              <div className="cf-section-title">Trust & Discovery</div>
              <div className="cf-kv-row"><span>Trust Level</span><strong>{manifest.trust?.level}</strong></div>
              <div className="cf-kv-row"><span>Verification</span><strong>{manifest.trust?.verification}</strong></div>
              <div className="cf-kv-row"><span>Public</span><strong>{manifest.discovery?.public?'Yes':'No'}</strong></div>
              <div className="cf-kv-row"><span>Searchable</span><strong>{manifest.discovery?.searchable?'Yes':'No'}</strong></div>
            </div>
            <div className="cf-section">
              <div className="cf-section-title">Security</div>
              <div className="cf-kv-row"><span>Sandboxed</span><strong>{manifest.security?.sandboxed?'Yes':'No'}</strong></div>
              <div className="cf-chips" style={{marginTop:8}}>{(manifest.security?.capabilities||[]).map(c=><span key={c} className="cf-chip cf-chip-sec">{c}</span>)}</div>
            </div>
            {(manifest.deployHistory||[]).length > 0 && (
              <div className="cf-section">
                <div className="cf-section-title">Deploy History</div>
                {[...(manifest.deployHistory||[])].reverse().map((h,i) => (
                  <div key={i} className="cf-history-entry">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span className="cf-history-targets">{(h.targets||[]).join(', ')}</span>
                      {h.score != null && <span className={`cf-score-sm ${h.score>=80?'good':h.score>=50?'warn':'bad'}`}>{h.score}</span>}
                    </div>
                    <div className="cf-history-date">{new Date(h.deployedAt).toLocaleString()}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="cf-manifest-right">
            {/* Readiness panel */}
            <div className="cf-cert-panel">
              <div className="cf-cert-title">Readiness</div>
              {!crlDone ? (
                <>
                  <div style={{fontSize:11,color:'var(--muted2)',marginBottom:8}}>{CRL_STAGES.length} stages · {CRL_STAGES.flatMap(s=>s.checks).length} checks</div>
                  <button className="cf-readiness-btn" onClick={() => setPhase('crl')}>▶ Run Readiness Check</button>
                </>
              ) : (
                <div className="cf-readiness-compact">
                  {(() => { const v=crlVerdict(crlResults); return (
                    <div className={`crl-verdict ${v}`} style={{padding:'8px 12px',gap:8}}>
                      <div className="crl-verdict-icon" style={{fontSize:16}}>{v==='ready'?'✅':v==='needs_review'?'⚠️':'🚫'}</div>
                      <div>
                        <div className="crl-verdict-title" style={{fontSize:12}}>{v==='ready'?'Ready':v==='needs_review'?'Needs Review':'Blocked'}</div>
                        <div className="crl-verdict-sub">{crlScore(crlResults)}/100</div>
                      </div>
                    </div>
                  );})()}
                  {DEPLOY_TARGETS.map(dt => {
                    const gs=gateStatus(dt.id,crlResults);
                    return (
                      <div key={dt.id} className="cf-readiness-compact-row">
                        <span>{dt.label}</span>
                        <span className={`crl-gate-badge ${gs}`}>{gs==='open'?'Open':gs==='blocked'?'Blocked':gs==='warn'?'Warn':'—'}</span>
                      </div>
                    );
                  })}
                  <button className="cf-cert-btn" style={{marginTop:4}} onClick={() => setPhase('crl')}>Full Report →</button>
                </div>
              )}
            </div>
            {/* Quick cert */}
            <div className="cf-cert-panel">
              <div className="cf-cert-title">Quick Cert</div>
              {score != null && (
                <div className={`cf-score-display ${score>=80?'good':score>=50?'warn':'bad'}`}>
                  <div className="cf-score-num">{score}</div>
                  <div className="cf-score-label">/100</div>
                </div>
              )}
              <div className="cf-cert-checks">
                {CERT_CHECKS.map(check => {
                  const s = certState[check];
                  return (
                    <div key={check} className={`cf-cert-row ${s||''}`}>
                      <span className="cf-cert-check">{check}</span>
                      <span className="cf-cert-status">{!s&&!certRunning?'—':!s?'…':s==='pass'?'✓':'⚠'}</span>
                    </div>
                  );
                })}
              </div>
              <button className="cf-cert-btn" onClick={runCertification} disabled={certRunning}>
                {certRunning ? 'Running…' : certDone ? 'Re-certify' : 'Run Certification'}
              </button>
            </div>
            {/* Deploy */}
            <div className="cf-deploy-panel">
              <div className="cf-cert-title">Deploy</div>
              {DEPLOY_TARGETS.map(dt => {
                const gs = crlDone ? gateStatus(dt.id,crlResults) : 'pending';
                return (
                  <label key={dt.id} className="cf-deploy-row" style={{opacity:gs==='blocked'?0.4:1}}>
                    <input type="checkbox" checked={!!deployTargets[dt.id]} disabled={gs==='blocked'}
                      onChange={e => setDeployTargets(prev => ({...prev,[dt.id]:e.target.checked}))} />
                    <span>{dt.label}</span>
                    {gs==='blocked' && <span style={{marginLeft:'auto',fontSize:9,color:'var(--red)'}}>blocked</span>}
                  </label>
                );
              })}
              <button className="cf-deploy-btn" onClick={deployConstruct}>Deploy Construct</button>
            </div>
            {(gmnGeneratedHtml || manifest._generatedHtml) && (
              <div className="cf-gmn-preview-panel">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <div className="cf-cert-title" style={{margin:0}}>🌐 Site Preview</div>
                  <span style={{fontSize:10,color:'var(--muted)'}}>~{Math.round((gmnGeneratedHtml||manifest._generatedHtml||'').length/1024)}KB · GMN sandbox</span>
                </div>
                <iframe
                  className="cf-gmn-preview-iframe"
                  srcDoc={gmnGeneratedHtml || manifest._generatedHtml}
                  sandbox="allow-scripts allow-same-origin"
                  title="GMN site preview"
                />
              </div>
            )}
            <div className="cf-gmn-panel">
              <div className="cf-gmn-title">✦ {manifest.type==='gmn-site' ? 'Host on GMN' : 'Publish To GMN'}</div>
              {manifest.type !== 'gmn-site' && (
                <div className="cf-gmn-copy">
                  Generate a hosted GMN prototype from this manifest. Login, profile, community, and commerce pieces are staged when the manifest asks for them.
                </div>
              )}
              {manifest.type === 'gmn-site' && (gmnGeneratedHtml || manifest._generatedHtml) && !deployedSet.gmn && (
                <div className="cf-gmn-copy">
                  Your AI-generated site is staged and ready. Set a GMN address and deploy — it will be live on your SOMA instance and discoverable across the mesh.
                </div>
              )}
              <div className="cf-gmn-controls">
                <input
                  className="cf-gmn-input"
                  value={gmnSiteName || slugify(manifest.name || manifest.id)}
                  onChange={e => setGmnSiteName(slugify(e.target.value))}
                  placeholder="site-name"
                />
                <button className="cf-gmn-btn" disabled={gmnPublishing || !!deployedSet.gmn} onClick={publishManifestToGmn}>
                  {gmnPublishing ? '…' : deployedSet.gmn ? '✓ Live' : manifest.type==='gmn-site' ? 'Deploy →' : 'Publish'}
                </button>
              </div>
              {deployedSet.gmn && manifest.gmnUrl && (
                <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:4}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--accent2)',flex:1,wordBreak:'break-all'}}>{manifest.gmnUrl}</span>
                    <button className="cf-gmn-btn secondary" style={{flexShrink:0,padding:'3px 8px',fontSize:10}} onClick={() => { navigator.clipboard?.writeText(manifest.gmnUrl); setGmnPublishStatus({type:'ok', text:'Copied!'}); }}>
                      Copy
                    </button>
                  </div>
                  <div style={{fontSize:11,color:'var(--green)',fontWeight:600}}>✓ Live on your GMN</div>
                  <div style={{fontSize:10,color:'var(--muted)',lineHeight:1.4}}>Open SOMA Portal → navigate to <code style={{color:'var(--accent2)'}}>{manifest.gmnUrl}</code></div>
                </div>
              )}
              {!deployedSet.gmn && manifest.gmnUrl && (
                <button className="cf-gmn-btn secondary" onClick={() => { navigator.clipboard?.writeText(manifest.gmnUrl); setGmnPublishStatus({type:'ok', text:`Copied ${manifest.gmnUrl}`}); }}>
                  Copy {manifest.gmnUrl}
                </button>
              )}
              {gmnPublishStatus && <div className={`cf-gmn-status ${gmnPublishStatus.type || ''}`}>{gmnPublishStatus.text}</div>}
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (phase === 'crl' && manifest) {
    const verdict = crlDone ? crlVerdict(crlResults) : null;
    const score = crlDone ? crlScore(crlResults) : null;
    const totalChecks = CRL_STAGES.reduce((a,s)=>a+s.checks.length,0);
    const nCritFails = crlDone ? critFails(crlResults).length : 0;
    return (
      <div className="cf-root">
        <div className="cf-header">
          <button className="cf-back-btn" onClick={()=>setPhase('manifest')}>← Back</button>
          <div className="cf-title" style={{display:'flex',alignItems:'center',gap:8,flex:1}}>
            <span>Construct Readiness Loop</span>
            {crlDone && <span className={`trial-verdict-badge ${verdict}`} style={{fontSize:11,padding:'2px 8px'}}>
              {verdict==='ready'?'✓ Ready':verdict==='needs_review'?'⚠ Needs Review':'✗ Blocked'}
            </span>}
            {crlDone && score!=null && <span className="cf-score-sm">{score}/100</span>}
          </div>
          {!crlDone && !crlRunning && <button className="crl-run-btn" onClick={runCRL}>▶ Run All Checks</button>}
          {crlRunning && <span style={{fontSize:12,color:'var(--muted)',marginLeft:'auto'}}>Running checks…</span>}
        </div>

        <div className="crl-layout">
          <div className="crl-sidebar">
            {CRL_STAGES.map(stage => {
              const ss = stageStatus(stage.id, crlResults);
              const isActive = crlActive === stage.id;
              return (
                <div key={stage.id} className={`crl-stage-row${isActive?' active':''}`}>
                  <span className="crl-stage-icon">{stage.icon}</span>
                  <span className="crl-stage-label">{stage.label}</span>
                  <span className="crl-stage-status">
                    {isActive&&crlRunning ? '…' : ss==='pass'?'✓':ss==='warn'?'⚠':ss==='fail'?'✗':ss==='partial'?'↻':'○'}
                  </span>
                </div>
              );
            })}
          </div>

          <div className="crl-main">
            {!crlRunning && !crlDone && (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:12,padding:24}}>
                <div style={{fontSize:36}}>🔁</div>
                <div style={{fontWeight:600,fontSize:14,color:'var(--text)'}}>Construct Readiness Loop</div>
                <div style={{fontSize:12,color:'var(--muted)',textAlign:'center',maxWidth:280,lineHeight:1.5}}>
                  Runs {totalChecks} checks across {CRL_STAGES.length} stages to validate your construct before deployment.
                </div>
                <button className="crl-run-btn" onClick={runCRL} style={{marginTop:4}}>▶ Run Readiness Check</button>
              </div>
            )}

            {(crlRunning || crlDone) && (
              <div>
                {CRL_STAGES.map(stage => {
                  const hasAny = stage.checks.some(c=>crlResults[c.id]);
                  const isActiveStage = crlActive === stage.id;
                  if (!hasAny && !isActiveStage) return null;
                  return (
                    <div key={stage.id} style={{marginBottom:10}}>
                      <div className="crl-stage-heading">
                        <span>{stage.icon}</span>
                        <span style={{fontWeight:600}}>{stage.label}</span>
                        {isActiveStage && crlRunning && <span style={{marginLeft:'auto',fontSize:11,color:'var(--muted)'}}>checking…</span>}
                      </div>
                      <div className="crl-check-list">
                        {stage.checks.map(c => {
                          const r = crlResults[c.id];
                          if (!r && !isActiveStage) return null;
                          return (
                            <div key={c.id} className={`crl-check-row ${r||'pending'}`}>
                              <span className="crl-check-status">
                                {!r?'…':r==='pass'?'✓':r==='warn'?'⚠':'✗'}
                              </span>
                              <span style={{flex:1,fontSize:12}}>{c.label||c.id}</span>
                              {r==='fail' && c.critical && <span className="crl-critical-tag">critical</span>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {crlDone && (
              <>
                <div className={`crl-verdict ${verdict}`}>
                  <span className="crl-verdict-icon">
                    {verdict==='ready'?'✅':verdict==='needs_review'?'⚠️':'🚫'}
                  </span>
                  <div>
                    <div className="crl-verdict-title">
                      {verdict==='ready'?'Ready to Deploy':verdict==='needs_review'?'Needs Review':'Blocked'}
                    </div>
                    <div className="crl-verdict-sub">
                      {verdict==='ready'
                        ? `Score ${score}/100 — all gates open`
                        : verdict==='needs_review'
                          ? `Score ${score}/100 — warnings present, review before deploying`
                          : `Score ${score}/100 — ${nCritFails} critical failure${nCritFails!==1?'s':''} must be resolved`}
                    </div>
                  </div>
                </div>

                <div className="crl-gates-title">Deploy Gates</div>
                <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:16}}>
                  {DEPLOY_TARGETS.map(dt => {
                    const gs = gateStatus(dt.id, crlResults);
                    return (
                      <div key={dt.id} className="crl-gate-row">
                        <span className="crl-gate-name">{dt.label}</span>
                        <span className="crl-gate-req">{GATE_REQS[dt.id]}</span>
                        <span className={`crl-gate-badge ${gs}`}>
                          {gs==='open'?'Open':gs==='warn'?'Warn':'Blocked'}
                        </span>
                      </div>
                    );
                  })}
                </div>

                <div className="trial-panel">
                  <div className="crl-gates-title">Construct Trial</div>
                  {trialState==='idle' && (
                    <div>
                      <div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>
                        Launches the construct in a sandbox and runs simulated actions to verify real-world behaviour.
                      </div>
                      <button className="crl-run-btn" onClick={runTrial}>▶ Run Construct Trial</button>
                    </div>
                  )}
                  {trialState==='running' && (
                    <div>
                      <div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>Running trial in sandbox…</div>
                      <div className="trial-log">
                        {trialLog.map((l,i) => (
                          <div key={i} className={`trial-log-row ${l.ok?'ok':'fail'}`}>
                            <span>{l.ok?'✓':'✗'}</span>
                            <span>{l.label}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {(trialState==='ready'||trialState==='needs_review'||trialState==='blocked') && (
                    <div>
                      <div className="trial-log">
                        {trialLog.map((l,i) => (
                          <div key={i} className={`trial-log-row ${l.ok?'ok':'fail'}`}>
                            <span>{l.ok?'✓':'✗'}</span>
                            <span>{l.label}</span>
                          </div>
                        ))}
                      </div>
                      <div className={`trial-verdict-badge ${trialState}`} style={{marginTop:8,display:'inline-block'}}>
                        {trialState==='ready'?'✅ Trial: Ready':trialState==='needs_review'?'⚠ Trial: Needs Review':'🚫 Trial: Blocked'}
                      </div>
                      <button className="crl-run-btn" onClick={runTrial} style={{marginTop:8,marginLeft:8,fontSize:11,opacity:0.7}}>↻ Re-run</button>
                    </div>
                  )}
                </div>

                <div className="crl-deploy-section">
                  <div className="crl-gates-title">Deploy</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                    {DEPLOY_TARGETS.map(dt => {
                      const gs = gateStatus(dt.id, crlResults);
                      const deployed = !!deployedSet[dt.id];
                      const isGmn = dt.id === 'gmn';
                      return (
                        <div key={dt.id} className={`crl-deploy-target ${gs}`}>
                          <div style={{fontWeight:600,fontSize:12,marginBottom:2}}>{dt.label}</div>
                          <div style={{fontSize:10,color:'var(--muted)',marginBottom:6,lineHeight:1.3}}>{GATE_REQS[dt.id]}</div>
                          {deployed
                            ? <span style={{fontSize:11,color:'var(--green)'}}>{isGmn ? '✓ Live on GMN' : '✓ Deployed'}</span>
                            : <button
                                className={`crl-deploy-target-btn ${gs==='blocked'?'blocked':'open'}`}
                                disabled={gs==='blocked' || (isGmn && gmnPublishing)}
                                onClick={isGmn ? publishManifestToGmn : ()=>deployToTarget(dt.id)}>
                                {gs==='blocked' ? 'Blocked' : isGmn ? (gmnPublishing ? '…' : 'Publish →') : 'Deploy →'}
                              </button>
                          }
                          {isGmn && deployed && manifest?.gmnUrl && (
                            <div style={{marginTop:4,fontSize:10,color:'var(--muted)',wordBreak:'break-all'}}>{manifest.gmnUrl}</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <button className="crl-run-btn" onClick={runCRL} style={{marginTop:16,opacity:0.55,fontSize:11}}>↻ Re-run All Checks</button>
              </>
            )}
          </div>
        </div>
      </div>
    );
  }

  return null;
}

// ── Preview pane ──────────────────────────────────────────────
const DEVICES = [
  { id:'desktop',   label:'Desktop',   w:null, h:null, icon:ICONS.desktop   },
  { id:'tablet',    label:'Tablet',    w:768,  h:1024, icon:ICONS.tablet    },
  { id:'phone',     label:'Phone',     w:390,  h:844,  icon:ICONS.phone     },
  { id:'construct', label:'Construct', w:null, h:null, icon:ICONS.construct },
];

function PreviewPane({ previewHtml='', previewTitle='Pulse Preview' }) {
  const [device, setDevice] = useState('desktop');
  const [url, setUrl] = useState(()=>localStorage.getItem('mx_preview_url')||'http://localhost:3000');
  const [inputUrl, setInputUrl] = useState(()=>localStorage.getItem('mx_preview_url')||'http://localhost:3000');
  const [serverUp, setServerUp] = useState(false);
  // 'idle' | 'detecting' | 'starting' | 'waiting' | 'error'
  const [launchState, setLaunchState] = useState('idle');
  const [launchCmd, setLaunchCmd] = useState('npm run dev');
  const [launchLog, setLaunchLog] = useState('');
  const iframeRef = useRef(null);
  const autoTriggered = useRef(false);
  const d = DEVICES.find(x=>x.id===device);

  // Poll the target URL every 2s while waiting for it to come up
  useEffect(()=>{
    let mounted=true;
    const check=async()=>{
      try{
        await fetch(url,{mode:'no-cors',signal:AbortSignal.timeout(1500)});
        if(mounted){ setServerUp(true); setLaunchState('idle'); }
      } catch{
        if(mounted) setServerUp(false);
      }
    };
    check();
    const interval = launchState==='waiting' ? 2000 : 5000;
    const t=setInterval(check,interval);
    return ()=>{mounted=false;clearInterval(t);};
  },[url, launchState]);

  // Auto-detect & start dev server when preview first opens and server is down
  useEffect(()=>{
    if(autoTriggered.current || serverUp) return;
    autoTriggered.current = true;
    const timer = setTimeout(()=>{
      if(!serverUp) autoLaunch();
    }, 1800);
    return ()=>clearTimeout(timer);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  const detectDevCmd = async () => {
    // Ask SOMA to check for package.json and figure out the right start command
    const maxBase = window.SOMA_URL || '';
    try {
      const r = await fetch(`${maxBase}/api/tools/shell/run`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: 'node -e "try{const p=require(\'./package.json\');const s=p.scripts||{};console.log(s.dev?\'dev\':s.start?\'start\':s[\'dev:start\']?\'dev:start\':\'\');}catch{console.log(\'\');}"', timeoutMs:5000 })
      });
      const d = await r.json();
      const script = (d.stdout||'').trim();
      if (script) return `npm run ${script}`;
    } catch {}
    return 'npm run dev';
  };

  const autoLaunch = async () => {
    const maxBase = window.SOMA_URL || '';
    setLaunchState('detecting');
    setLaunchLog('Detecting dev script…');
    const cmd = await detectDevCmd();
    setLaunchCmd(cmd);
    setLaunchState('starting');
    setLaunchLog(`Starting: ${cmd}`);
    try {
      const r = await fetch(`${maxBase}/api/tools/shell/start`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: cmd, name: 'dev-server' })
      });
      const result = await r.json();
      if (result.success || result.pid) {
        setLaunchState('waiting');
        setLaunchLog(`Server starting (pid ${result.pid})… waiting for ${url}`);
      } else {
        setLaunchState('error');
        setLaunchLog(result.error || 'Failed to start dev server');
      }
    } catch(err) {
      setLaunchState('error');
      setLaunchLog(err.message);
    }
  };

  const navigate=()=>{setUrl(inputUrl);localStorage.setItem('mx_preview_url',inputUrl);};
  const reload=()=>{ if(iframeRef.current) iframeRef.current.src=url; };
  const iframeH = device==='desktop' ? 520 : d.h;
  const wrapStyle = device==='desktop'
    ? {width:'100%',height:'100%',minHeight:480,display:'flex',flexDirection:'column'}
    : {width:d.w,flexShrink:0,display:'flex',flexDirection:'column'};
  const hasLocalPreview = !!String(previewHtml || '').trim();

  const launchBusy = launchState==='detecting'||launchState==='starting'||launchState==='waiting';

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}}>
      <div className="preview-toolbar">
        {device !== 'construct' && !hasLocalPreview && <>
          <button className="preview-nav-btn" onClick={()=>iframeRef.current?.contentWindow?.history.back()}>{ICONS.back}</button>
          <button className="preview-nav-btn" onClick={()=>iframeRef.current?.contentWindow?.history.forward()}>{ICONS.forward}</button>
          <button className="preview-nav-btn" onClick={reload}>{ICONS.reload}</button>
          <form onSubmit={e=>{e.preventDefault();navigate();}} style={{flex:1,display:'flex',maxWidth:340}}>
            <input className="preview-url-bar" value={inputUrl} onChange={e=>setInputUrl(e.target.value)} onFocus={e=>e.target.select()} style={{width:'100%'}}/>
          </form>
          <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11}}>
            <div style={{width:6,height:6,borderRadius:'50%',background:serverUp?'var(--green)':launchBusy?'var(--amber)':'var(--muted2)',flexShrink:0,
              ...(launchBusy?{animation:'pulse 1.2s infinite'}:{})}}/>
            <span style={{color:serverUp?'var(--green)':launchBusy?'var(--amber)':'var(--muted2)'}}>
              {serverUp?'live':launchState==='waiting'?'starting…':launchBusy?launchState:'offline'}
            </span>
          </div>
        </>}
        {device === 'construct' && <span style={{fontSize:12,fontWeight:700,color:'var(--accent2)',letterSpacing:2,padding:'0 8px'}}>CONSTRUCT FOUNDRY</span>}
        <div className="device-group" style={{marginLeft:'auto'}}>
          {DEVICES.map(dv=>(
            <button key={dv.id} className={`device-btn ${device===dv.id?'active':''}`} onClick={()=>setDevice(dv.id)}>
              {dv.icon} {dv.label}
            </button>
          ))}
        </div>
      </div>
      {device === 'construct' && <ConstructFoundry />}
      {device !== 'construct' && <div className="preview-stage">
        <div className="preview-device-wrap" style={wrapStyle}>
          {device!=='desktop' && !hasLocalPreview && (
            <div className="browser-chrome">
              <div className="bc-dots">
                <div className="bc-dot" style={{background:'#ef4444'}}/><div className="bc-dot" style={{background:'#f59e0b'}}/><div className="bc-dot" style={{background:'#10b981'}}/>
              </div>
              <div className="bc-bar">{url}</div>
              <button className="preview-nav-btn" onClick={reload}>{ICONS.reload}</button>
            </div>
          )}
          <div className="preview-iframe-wrap" style={{height:iframeH,borderRadius:device!=='desktop'?'0 0 10px 10px':'0'}}>
            {hasLocalPreview ? (
              <iframe ref={iframeRef} className="preview-iframe" srcDoc={previewHtml} style={{height:iframeH}} title={previewTitle} sandbox="allow-scripts allow-same-origin allow-forms allow-popups"/>
            ) : serverUp ? (
              <iframe ref={iframeRef} className="preview-iframe" src={url} style={{height:iframeH}} title="Preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"/>
            ) : (
              <div className="preview-no-server">
                <div style={{opacity:.25,display:'flex'}}>{ICONS.desktop}</div>
                {launchBusy ? (
                  <>
                    <div className="pns-title" style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{display:'inline-block',animation:'tcb-spin .9s linear infinite',fontSize:16}}>⟳</span>
                      {launchState==='detecting'?'Detecting dev server…':launchState==='starting'?'Launching dev server…':'Waiting for server…'}
                    </div>
                    <div className="pns-cmd"><span style={{color:'var(--accent2)'}}>❯</span><span>{launchCmd}</span></div>
                    <div className="pns-hint" style={{color:'var(--muted)',fontSize:11,marginTop:4}}>{launchLog}</div>
                  </>
                ) : (
                  <>
                    <div className="pns-title">{launchState==='error'?'Failed to start dev server':`No server at ${url}`}</div>
                    {launchState==='error' && <div className="pns-hint" style={{color:'var(--red)',fontSize:11,marginBottom:8}}>{launchLog}</div>}
                    <div className="pns-cmd"><span style={{color:'var(--accent2)'}}>❯</span><span>{launchCmd}</span></div>
                    <div className="pns-hint">Pulse will auto-start your dev server.<br/>Click below to retry.</div>
                    <button className="preview-reload-btn" onClick={()=>{autoTriggered.current=false;autoLaunch();}}>
                      {launchState==='error'?'Retry Launch':'Launch Dev Server'}
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      </div>}
    </div>
  );
}

// Auto-detect API provider from key prefix
function detectProvider(key) {
  const k = key.trim();
  if (k.startsWith('sk-ant-'))           return 'anthropic';
  if (k.startsWith('sk-proj-'))          return 'openai';
  if (k.startsWith('AIza'))              return 'google';
  if (k.startsWith('sk-') && k.length > 40) return 'deepseek'; // fallback: most sk- that aren't openai
  if (k.startsWith('gsk_'))              return 'groq';
  if (k.startsWith('xai-'))              return 'xai';
  if (k.startsWith('sk-') && k.length <= 56) return 'openai';
  return null;
}

const PROVIDER_META = {
  deepseek:  { label:'DeepSeek',  color:'#60a5fa', note:'deepseek-reasoner · deepseek-coder-v2',   placeholder:'sk-...' },
  openai:    { label:'OpenAI',    color:'#a78bfa', note:'gpt-4o · o3 · gpt-4o-mini',               placeholder:'sk-proj-...' },
  anthropic: { label:'Anthropic', color:'#f472b6', note:'claude-opus-4 · claude-haiku',            placeholder:'sk-ant-...' },
  google:    { label:'Google AI', color:'#34d399', note:'gemini-2.0-flash · gemini-1.5-pro',        placeholder:'AIza...' },
  groq:      { label:'Groq',      color:'#fb923c', note:'llama3-70b · mixtral-8x7b (fast & free)',  placeholder:'gsk_...' },
  xai:       { label:'xAI (Grok)',color:'#e879f9', note:'grok-2 · grok-beta',                      placeholder:'xai-...' },
};

function SettingsModal({ onClose, maxUrl, setMaxUrl, onOpenSetup }) {
  const [tab, setTab]       = useState('general');
  const [urlDraft, setUrlDraft] = useState(maxUrl);
  const [keys, setKeys]     = useState(() => {
    const stored = {};
    Object.keys(PROVIDER_META).forEach(id => {
      stored[id] = localStorage.getItem(`mx_key_${id}`) || '';
    });
    stored.maxApiKey = localStorage.getItem('pulse_api_key') || window.__SOMA_API_KEY || '';
    return stored;
  });
  const [pasteKey, setPasteKey]   = useState('');
  const [detected, setDetected]   = useState(null);
  const [saveState, setSaveState] = useState({});
  const [discord, setDiscord]     = useState(() => localStorage.getItem('mx_discord_webhook') || '');
  const [discordSaved, setDiscordSaved] = useState(false);

  const saveKey = async (provider, value) => {
    const val = value !== undefined ? value : keys[provider];
    setSaveState(s => ({...s, [provider]: 'saving'}));
    localStorage.setItem(`mx_key_${provider}`, val);
    if (provider === 'maxApiKey') {
      localStorage.setItem('pulse_api_key', val);
      window.__SOMA_API_KEY = val;
      setSaveState(s => ({...s, [provider]: 'saved'}));
      setTimeout(() => setSaveState(s => ({...s, [provider]: ''})), 2500);
      return;
    }
    try {
      await fetch(`${maxUrl}/api/config`, { method:'POST', headers:authHdrs(), body:JSON.stringify({ [provider]: val }) });
      setSaveState(s => ({...s, [provider]: 'saved'}));
    } catch {
      setSaveState(s => ({...s, [provider]: 'local'}));
    }
    setTimeout(() => setSaveState(s => ({...s, [provider]: ''})), 2500);
  };

  const handlePaste = (raw) => {
    setPasteKey(raw);
    const p = detectProvider(raw);
    setDetected(p);
  };

  const applyPasted = () => {
    if (!detected || !pasteKey.trim()) return;
    setKeys(k => ({...k, [detected]: pasteKey.trim()}));
    saveKey(detected, pasteKey.trim());
    setPasteKey('');
    setDetected(null);
  };

  const saveUrl = () => { setMaxUrl(urlDraft); onClose(); };

  const saveDiscord = () => {
    localStorage.setItem('mx_discord_webhook', discord);
    setDiscordSaved(true);
    setTimeout(() => setDiscordSaved(false), 2000);

  const tabSt = {display:'flex',gap:0,marginBottom:20,borderBottom:'1px solid var(--border)'};

    background:'none',border:'none',padding:'6px 12px',fontSize:11.5,fontWeight:tab===id?600:400,

  const btn = (variant='primary') => ({
    padding:'5px 14px',background:variant==='primary'?'var(--accent)':'transparent',
    border:variant==='primary'?'none':'1px solid var(--border)',
    color:variant==='primary'?'#fff':'var(--muted)',borderRadius:5,fontWeight:600,fontSize:11.5,cursor:'pointer',flexShrink:0,
  });

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.65)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:12,padding:'24px 28px',width:480,maxHeight:'85vh',overflow:'auto',boxShadow:'0 8px 40px rgba(0,0,0,.6)'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <div style={{fontSize:14,fontWeight:700,letterSpacing:.5,display:'flex',alignItems:'center',gap:8}}>
            {ICONS.settings} Settings
          </div>
          <button style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',display:'flex'}} onClick={onClose}>{ICONS.close}</button>
        </div>

        <div style={tabSt}>
          {['general','api keys','integrations','about'].map(t => (
            <button key={t} style={tabBt(t)} onClick={()=>setTab(t)}>{t.charAt(0).toUpperCase()+t.slice(1)}</button>
          ))}
        </div>

        {/* ── General ── */}
        {tab === 'general' && (
          <div>
            <div style={{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:.8,marginBottom:6}}>SOMA URL</div>

                </div>
                <button onClick={()=>{onClose();onOpenSetup();}} style={{...btn('secondary'),display:'flex',alignItems:'center',gap:5}}>
                  {ICONS.bolt} Setup
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── API Keys ── */}
        {tab === 'api keys' && (
          <div>
            {/* Smart paste input */}
            <div style={{marginBottom:16,padding:'12px 14px',background:'var(--s3)',borderRadius:8,border:'1px solid var(--border)'}}>

              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <input
                  value={pasteKey}
                  onChange={e => handlePaste(e.target.value)}
                  onPaste={e => { const v = e.clipboardData.getData('text'); setTimeout(()=>handlePaste(v),0); }}
                  style={{...inp,fontFamily:'var(--mono)',flex:1}} placeholder="Paste your key here…"/>
                <button onClick={applyPasted} disabled={!detected}
                  style={{...btn('primary'),opacity:detected?1:.4,minWidth:70}}>
                  {detected ? `Add ${PROVIDER_META[detected]?.label||detected}` : 'Add'}
                </button>
              </div>
              {detected && (
                <div style={{marginTop:6,fontSize:11,color:'var(--green)',display:'flex',alignItems:'center',gap:5}}>
                  <span>●</span> Detected: <strong>{PROVIDER_META[detected]?.label || detected}</strong> — {PROVIDER_META[detected]?.note}
                </div>
              )}
              {pasteKey && !detected && (
                <div style={{marginTop:6,fontSize:11,color:'var(--amber)'}}>Unrecognized key format — paste manually below</div>
              )}
            </div>
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:12,lineHeight:1.6}}>

        {/* ── Integrations ── */}
        {tab === 'integrations' && (

              </div>

            <div style={row}>
              <input value={discord} onChange={e=>setDiscord(e.target.value)}
                style={inp} placeholder="https://discord.com/api/webhooks/…"/>
              <button onClick={saveDiscord} style={btn('primary')}>{discordSaved?'✓ Saved':'Save'}</button>
            </div>
            <div style={{fontSize:11,color:'var(--muted)',lineHeight:1.7,marginTop:4}}>
              In Discord: channel settings → Integrations → Create Webhook → Copy URL.
            </div>
            {discord && (
              <div style={{marginTop:16,padding:'10px 14px',background:'var(--s3)',borderRadius:8,border:'1px solid var(--border)'}}>
                <div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>Test your webhook</div>
                <button onClick={async()=>{
                  try{
                    await fetch(discord,{method:'POST',headers:{'Content-Type':'application/json'},
                      body:JSON.stringify({content:'👋 Pulse is connected! SOMA will post alerts here.',username:'Pulse'})});
                    alert('Test message sent!');
                  }catch(e){alert('Failed: '+e.message);}
                }} style={{...btn('secondary'),fontSize:11}}>Send test message</button>
              </div>
            )}
          </div>
        )}

        {/* ── About ── */}
        {tab === 'about' && (
          <div style={{fontSize:12,color:'var(--muted)',lineHeight:1.8}}>
            <div style={{fontSize:16,fontWeight:700,color:'var(--text)',marginBottom:8}}>Pulse</div>

            <div style={{background:'var(--s3)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px',fontSize:11.5}}>
              <div style={{marginBottom:4}}>Start SOMA backend: <code style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>npm run backend</code> or full app: <code style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>npm run start:all</code></div>
              <div>Dashboard: <code style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>http://localhost:3001</code></div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const BADGE_CREDITS = { free:0, fast:1, smart:3, genius:10 };

function getOptionById(id) { return ALL_MODEL_OPTIONS.find(o => o.id === id) || ALL_MODEL_OPTIONS[1]; }

// ── Model picker dropdown ─────────────────────────────────────
function ModelPicker({ selectedOption, onSelect, credits, brainState }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const opt = getOptionById(selectedOption);
  const used = credits.used; const total = credits.total;

  React.useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    if (open) document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  return (
    <div ref={ref} style={{position:'relative'}}>
      <div className="model-pill" onClick={() => setOpen(o => !o)}>
        <span className="mp-tier" style={{color:opt.color}}>{opt.icon}</span>
        <span className="mp-name">{opt.label}</span>

        <div className="model-dropdown">

                  <span style={{color:'var(--muted2)',fontWeight:400,fontSize:10}}>{section.hint}</span>

                  const isLive = m.id.startsWith('auto:') ? (liveB?.ready) :
                    liveB?.model && (liveB.model===m.id || liveB.model.includes(m.id.split(':')[0]));
                  return (
                    <div key={m.id} className={`md-row ${selectedOption===m.id?'active':''}`}
                      onClick={() => { onSelect(m.id); setOpen(false); }}>

                      <div className="mr-info">
                        <div className="mr-name">

                        <div className="mr-desc">{m.desc}</div>
                      </div>
                      <span className={`mr-badge badge-${m.badge}`}>{m.badge==='free'?'FREE':BADGE_CREDITS[m.badge]+'cr'}</span>

              <span className="mcb-label">Today's spend</span>
              <span className="mcb-val">{credits.currency ? `$${used.toFixed(4)}` : used.toLocaleString()+' cr'} / {credits.currency ? `$${total}` : total.toLocaleString()}</span>
            </div>
            <div className="mcb-track">
              <div className="mcb-fill" style={{width:pct+'%',background:pct>80?'var(--red)':pct>60?'var(--amber)':'var(--accent)'}}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
