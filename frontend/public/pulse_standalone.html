    const handler = e => {
      if ((e.metaKey||e.ctrlKey) && e.key==='s') {
        e.preventDefault();
        if (activeTabPath && fileContents[activeTabPath] !== undefined) {
          saveFile2(activeTabPath, fileContents[activeTabPath]);
        } else if (activeTab && fileContents[activeTab] !== undefined) {
          saveFile2(activeTabPath || activeTab, fileContents[activeTab]);
        }
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [activeTab, activeTabPath, fileContents, saveFile2]);

  // Ctrl+Shift+F = find in files, Ctrl+P = command palette
  React.useEffect(() => {
    const handler = e => {
      if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key==='F') {
        e.preventDefault(); setSideTab('search'); setSidebarOpen(true);

    return () => window.removeEventListener('keydown', handler);

            id: e.path || e.name,
            name: e.name || e.path?.split('/').pop(),
            type: e.type==='directory'||e.isDir ? 'dir' : 'file',

  const BINARY_EXTS = new Set(['exe','dll','bin','zip','tar','gz','bz2','7z','rar','pdf','db','sqlite','sqlite3','wasm','so','dylib','class','jar','pyc','pyo','o','a','lib']);
  const IMAGE_EXTS  = new Set(['png','jpg','jpeg','gif','webp','ico','bmp','tiff','avif']);

  const openFile=async f=>{
    const path = f.path || f.name;
    const tabName = f.name || path.split('/').pop();
    const ext = (tabName.split('.').pop()||'').toLowerCase();
    if(!openTabs.find(t=>t.name===tabName)) setOpenTabs(ts=>[...ts,{name:tabName, path}]);
    setActiveTab(tabName); setShowPreview(false); setLangOverride(null);
    // Binary / image guard
    if (BINARY_EXTS.has(ext)) {
      setFileContents(c=>({...c,[path]:`// Binary file — cannot display in editor\n// ${path}`}));
      return;
    }
    if (IMAGE_EXTS.has(ext)) {
      setFileContents(c=>({...c,[path]:`__IMAGE__:${maxUrl}/api/files/raw?path=${encodeURIComponent(path)}`}));
      return;
    }
    // Load content if not yet loaded, or forceReload=true (e.g. after SOMA wrote the file)
    if (connected && (fileContents[path] === undefined || f.forceReload)) {
      const content = await readFile2(path);
      if (content !== null) setFileContents(c => ({...c, [path]: content}));
    }
    if (f.line) {
      setTimeout(() => { if (window.jumpToLine) window.jumpToLine(f.line); }, 250);
    }
  };

  openFileRef.current = openFile;

  window.maxOpenFile = openFile;

    const n=name.trim().replace(/\\/g,'/');
    const tabName=n.split('/').pop();
    setLangOverride(null);
    if(!openTabs.find(t=>t.name===tabName)) setOpenTabs(ts=>[...ts,{name:tabName,path:n}]);

  };

  const renameFile = async (file) => {
    const oldPath = file.path || file.name;
    const oldName = file.name;
    const newName = prompt('Rename to:', oldName);
    if (!newName || newName === oldName) return;
    const newPath = oldPath.replace(oldName, newName);
    const safe = (p) => `"${p.replace(/"/g,'\\"')}"`;
    await shellRun(`node -e "require('fs').renameSync(${JSON.stringify(oldPath)},${JSON.stringify(newPath)})"`);

    setOpenTabs(ts => ts.map(t => t.name===oldName ? {...t, name:newName, path:newPath} : t));

    setFileContents(c => { const n={...c}; if(c[oldPath]!==undefined){n[newPath]=c[oldPath]; delete n[oldPath];} return n; });

      {showSetup && <SetupWizard onDismiss={()=>setShowSetup(false)}/>}
      {showShortcuts && <ShortcutOverlay onClose={()=>setShowShortcuts(false)}/>}
      {showLangPicker && activeTab && (

          onClose={()=>setShowLangPicker(false)}
        />
      )}

      {(steveMsg || steveTyping) && (
        <SteveToast
          msg={steveMsg}
          typing={steveTyping}
          onClose={()=>{setSteveMsg(null);setSteveTyping(false);}}
          onSendToMax={steveMsg ? async ()=>{

            setMessages(m=>[...m,{id:nextMsgId(),role:'max',persona:'companion',modelTier:'fast',
              text:'Steve queued a task for me~ 🍫 Looking into: **' + steveMsg.replace(/[^ws~!?,.-]/g,'').slice(0,60) + '**'}]);
            setSteveMsg(null);
            if(connected){
              try{ await fetch(maxUrl+'/api/goals',{method:'POST',headers:authHdrs(),body:JSON.stringify({title:goalTitle,priority:0.6})}); }catch{}

        />

      {showPalette && (

      {/* ── Title bar ── */}

            {gitChangedCount>0&&<span className="act-badge" style={{background:'var(--amber)'}}/>}
          </button>
          <button className={`act-btn ${sideTab==='graph'&&sidebarOpen?'active':''}`} title="Dependency Graph"
            onClick={()=>{ if(sideTab==='graph'&&sidebarOpen){setSidebarOpen(false);}else{setSideTab('graph');setSidebarOpen(true);} }}>
            {ICONS.graph}
          </button>
          <div className="act-spacer"/>
          <button className={`act-btn ${showOverview?'active':''}`} title="Overview" onClick={toggleOverview}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="9" y="1" width="6" height="14" rx="1"/><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/></svg>
          </button>
          <button className="act-btn" title="Settings" onClick={()=>setShowSettings(true)}>{ICONS.settings}</button>
        </div>

        {/* Sidebar */}
        <div className={`sidebar ${!sidebarOpen?'collapsed':''}`} style={{width:sidebarOpen?sidebarW:0}}>
          {sideTab==='files'&&(
            <>
              <div className="sb-header">
                <span>Explorer</span>
                <div className="sb-actions">
                  <button className="sb-icon-btn" title="New file" onClick={newFile}>{ICONS.plus}</button>
                  <button className="sb-icon-btn" title="New folder" onClick={async()=>{
                    const n=prompt('Folder name:'); if(!n||!n.trim()) return;
                    const safeName=n.trim().replace(/['"\\]/g,'');
                    try{
                      await fetch(`${maxUrl}/api/tools/shell/run`,{method:'POST',headers:authHdrs(),
                        body:JSON.stringify({command:`node -e "require('fs').mkdirSync('${safeName}',{recursive:true})"`,timeoutMs:5000})});
                      listFiles('.').then(f=>f&&setRealFiles(f));
                    }catch(err){alert('Failed to create folder: '+err.message);}
                  }}>{ICONS.newFolder}</button>
                  <button className="sb-icon-btn" title="Collapse all" onClick={collapseAll}>{ICONS.collapse}</button>
                </div>
              </div>
              <div className="sb-scroll">
                <div className="tree-group">
                  <div className="tree-group-label" style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingRight:8}}>
                    <span>{connected && realFiles ? cwd : 'my-fullstack-app'}</span>
                    {connected && <button className="sb-icon-btn" onClick={()=>listFiles('.').then(f=>f&&setRealFiles(f))} title="Refresh">{ICONS.reload}</button>}
                  </div>
                  {!realFiles && <FileTree files={DEMO_FILES} activeFile={activeTab} onOpen={openFile} treeOpen={treeOpen} setTreeOpen={setTreeOpen} onContextMenu={(e,f)=>setContextMenu({x:e.clientX,y:e.clientY,file:f})}/>}
                  {realFiles && realFiles.length === 0 && <div className="tree-loading">{ICONS.reload} Loading files…</div>}
                  {realFiles && realFiles.length > 0 && <FileTree files={realFiles} activeFile={activeTab} onOpen={openFile} treeOpen={treeOpen} setTreeOpen={setTreeOpen} onContextMenu={(e,f)=>setContextMenu({x:e.clientX,y:e.clientY,file:f})}/>}
                </div>
              </div>
            </>
          )}
          {sideTab==='search'&&(
            <FindInFiles connected={connected} maxUrl={maxUrl} onOpenFile={openFile} onClose={()=>setSidebarOpen(false)}/>
          )}
          {sideTab==='goals'&&(
            <>
              <div className="sb-header">
                <span>SOMA Goals</span>
                <span style={{color:'var(--accent2)',fontSize:12,fontWeight:700}}>{goals.length}</span>
              </div>
              <div className="sb-scroll">
                {goals.length===0&&<div style={{padding:'16px 12px',fontSize:11.5,color:'var(--muted)',textAlign:'center'}}>No active goals.</div>}
                {goals.map(g=>(
                  <div key={g.id} className="goal-item">
                    <div className="goal-dot"/>
                    <span className="goal-text">{g.title}</span>
                    <button className="goal-done-btn" title="Mark done" onClick={()=>doneGoal(g.id)} style={{display:'flex'}}>{ICONS.check}</button>
                  </div>
                ))}
              </div>
              <div className="add-goal-form">
                <input className="add-goal-input" placeholder="Add a goal…" value={newGoal} onChange={e=>setNewGoal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addGoal()}/>
                <button className="add-goal-btn" onClick={addGoal} style={{display:'flex',alignItems:'center'}}>{ICONS.plus}</button>
              </div>
            </>
          )}
          {sideTab==='git'&&(
            <GitPanel
              connected={connected} maxUrl={maxUrl}
              gitStaged={gitStaged} setGitStaged={setGitStaged}
              openFile={openFile}
              onChangedCount={setGitChangedCount}
              onRunInTerminal={cmd=>{setBottomTab('terminal');setShowBottom(true);runCommand(cmd);}}
            />
          )}
          {sideTab==='graph'&&(
            <DependencyGraph connected={connected} maxUrl={maxUrl} onOpenFile={openFile}/>
          )}
        </div>

        {/* Sidebar resize handle */}
        {sidebarOpen && (
          <div className="sidebar-resize" onMouseDown={e=>{setDraggingSidebar(true);sidebarDragX.current=e.clientX;sidebarDragW.current=sidebarW;}}/>
        )}

        {/* Editor pane */}
        <div className="editor-pane">
          {/* Pending changes banner */}
          {pendingChanges.filter(p=>p.status==='pending').length > 0 && (
            <div className="changes-banner">
              <div className="cb-label">
                <span style={{display:'flex'}}>{ICONS.warning}</span>
                {pendingChanges.filter(p=>p.status==='pending').length} pending {pendingChanges.filter(p=>p.status==='pending').length===1?'change':'changes'} from SOMA
              </div>
              <button className="cb-accept-all" onClick={()=>{setPendingChanges(ps=>ps.map(p=>p.status==='pending'?{...p,status:'accepted'}:p));playAccept();setTimeout(()=>{setSteveTyping(true);setTimeout(()=>{setSteveTyping(false);playStevePop();setSteveMsg("all changes accepted! SOMA's code is live now. 🎉");setTimeout(()=>setSteveMsg(null),6000);},800);},300);}}>
                Accept All
              </button>
              <button className="cb-reject-all" onClick={()=>setPendingChanges(ps=>ps.map(p=>p.status==='pending'?{...p,status:'rejected'}:p))}>
                Reject All
              </button>
            </div>
          )}
          <div className="tabs-bar">
            {openTabs.map(t=>(
              <div key={t.name} className={`tab ${activeTab===t.name?'active':''}`} onClick={()=>setActiveTab(t.name)}>
                <span className="tab-icon">{fileIcon(t.name)}</span>
                {t.name}
                {unsaved[t.name]
                  ? <span className="tab-dot" title="Unsaved changes"/>
                  : <span className="tab-close" onClick={e=>closeTab(e,t.name)} style={{display:'flex',alignItems:'center',justifyContent:'center'}}>{ICONS.close}</span>
                }
              </div>
            ))}
            {openTabs.length===0&&<span className="tab-welcome">Open a file</span>}
          </div>
          <div style={{flex:1,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}}>
            {(()=>{
              if (!activeTab) return null;
              const edContent = fileContents[activeTabPath] ?? fileContents[activeTab] ?? (DEMO_FILE_CONTENTS[activeTab] || null);
              // Show welcome overlay when content isn't loaded yet (no unsaved draft, not a demo file)
              if (edContent === null && !unsaved[activeTab]) return null;
              if (typeof edContent === 'string' && edContent.startsWith('__IMAGE__:')) {
                const imgUrl = edContent.slice(10);
                return (
                  <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--s1)',overflow:'auto'}}>
                    <img src={imgUrl} alt={activeTab} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',borderRadius:4}}
                      onError={e=>{e.currentTarget.style.display='none';}}/>
                  </div>
                );
              }
              const activePendingChange = pendingChanges.find(p => p.status === 'pending' && (p.file === activeTabPath || p.file === activeTab || p.file === ('src/' + activeTab)));
              return (
                <MonacoEditor
                  key={activeTab}
                  fileName={activeTab}
                  content={edContent ?? ''}
                  onChange={content => handleEditorChange(activeTabPath || activeTab, content)}
                  langOverride={langOverride}
                  pendingChange={activePendingChange}
                  onAcceptPending={handleAcceptPendingChange}
                  onRejectPending={handleRejectPendingChange}
                  onInlineGenerate={(prompt, sel) => {
                     let msg = `INLINE EDIT REQUEST: ${prompt}\nFile: ${activeTab}`;
                     if (sel && sel.startLineNumber !== sel.endLineNumber) {
                       const lines = (edContent||'').split('\n');
                       const target = lines.slice(sel.startLineNumber-1, sel.endLineNumber).join('\n');
                       msg += `\nTarget lines ${sel.startLineNumber}-${sel.endLineNumber}:\n${target}`;
                     }
                     sendMessage(msg);
                  }}
                />
              );
            })()}
            <div className={`save-status ${saveStatus==='saved'?'show':''}`}>
              {saveStatus==='saving'?'saving…':'✓ saved'}
            </div>
            {/* Welcome screen — inside the positioned container so absolute overlay is scoped */}
            {(!activeTab || (!unsaved[activeTab] && fileContents[activeTabPath??activeTab]==null && !DEMO_FILE_CONTENTS[activeTab])) && (
              <div className="welcome" style={{position:'absolute',inset:0,zIndex:2,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--s1)'}}>
                <div className="welcome-logo">Pulse</div>
                <div className="welcome-hint">Open a file or tell SOMA what to build →<br/><br/><kbd>Ctrl+K</kbd> palette &nbsp; <kbd>Ctrl+S</kbd> save &nbsp; <kbd>/</kbd> commands</div>
              </div>
            )}
          </div>
          {showBottom && (
            <div className="bottom-panel" style={{height:bottomH}}>
              <div className="bp-resize" onMouseDown={e=>{setDraggingBottom(true);bottomDragY.current=e.clientY;bottomDragH.current=bottomH;}}/>
              <div className="bp-tabs">
                <div className={`bp-tab ${bottomTab==='terminal'?'active':''}`} onClick={()=>setBottomTab('terminal')}>{ICONS.terminal}&nbsp; Terminal</div>
                <div className={`bp-tab ${bottomTab==='output'?'active':''}`} onClick={()=>setBottomTab('output')}>Output</div>
                <div className={`bp-tab ${bottomTab==='problems'?'active':''}`} onClick={()=>{setBottomTab('problems');if(connected&&problemLines===null)runProblemsCheck();}}>{ICONS.warning}&nbsp; Problems{problemCount>0&&<span style={{marginLeft:4,color:'var(--red)',fontWeight:700}}>{problemCount}</span>}</div>
                <button className="sb-icon-btn bp-close" style={{display:'flex'}} onClick={()=>setShowBottom(false)}>{ICONS.close}</button>
              </div>
              {/* Terminal tab */}
              {bottomTab==='terminal' && <>
                <div className="terminal-body" ref={termBodyRef} onClick={()=>termInputRef.current?.focus()}>
                  {termLines.map(l=>(
                    <div key={l.id} className="term-line">
                      {l.type==='prompt'&&<><span className="term-prompt">❯</span><span className="term-cmd">{l.text}</span></>}
                      {l.type==='out' &&<span className="term-out">{l.text}</span>}
                      {l.type==='ok'  &&<span className="term-ok">{l.text}</span>}
                      {l.type==='err' &&<span className="term-err">{l.text}</span>}
                      {l.type==='info'&&<span className="term-info">{l.text}</span>}
                    </div>
                  ))}
                  {termRunning && <div className="term-line"><span className="term-info"><span className="term-spinner">◌</span> running…</span></div>}
                </div>
                <div className="ai-term-row" style={{display:'flex', gap:8, padding:'6px 12px', background:'var(--s2)', borderBottom:'1px solid var(--border)', alignItems:'center'}}>
                  <span style={{color:'var(--accent)', fontSize:14}}>{ICONS.bolt}</span>
                  <input className="term-input" style={{fontFamily:'var(--ui)', fontSize:12, flex:1, background:'transparent', border:'none', color:'var(--text)', outline:'none'}}
                    placeholder="AI Terminal: What do you want to do? (e.g., undo last commit)"
                    value={aiTermInput} onChange={e=>setAiTermInput(e.target.value)}
                    onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); handleAiTerminal(); } }}
                    disabled={aiTermTranslating || termRunning || !connected} spellCheck="false"
                  />
                  {aiTermTranslating && <span className="term-spinner" style={{color:'var(--accent)',fontSize:13}}>◌</span>}
                  <button style={{padding:'3px 10px', background:'var(--accent)', border:'none', borderRadius:4, color:'#fff', cursor:'pointer', fontSize:11, fontWeight:600}} 
                          onClick={handleAiTerminal} disabled={aiTermTranslating || termRunning || !connected}>
                    Translate
                  </button>
                </div>
                <div className="term-input-row">
                  <span className="term-prompt">❯</span>
                  <input ref={termInputRef} className="term-input"
                    placeholder={connected?"Run a command…":"Run a command… (demo mode)"}
                    value={termInput} onChange={e=>setTermInput(e.target.value)}
                    onKeyDown={e=>{
                      if(e.key==='Enter'){e.preventDefault();runCommand(termInput);}
                      if(e.key==='ArrowUp'){e.preventDefault();const nx=Math.min(termHistIdx+1,termHistory.length-1);setTermHistIdx(nx);setTermInput(termHistory[nx]||'');}
                      if(e.key==='ArrowDown'){e.preventDefault();const nx=Math.max(termHistIdx-1,-1);setTermHistIdx(nx);setTermInput(nx===-1?'':termHistory[nx]||'');}
                      if(e.key==='l'&&e.ctrlKey){e.preventDefault();setTermLines([]);}
                    }}
                    disabled={termRunning} autoComplete="off" spellCheck="false"
                  />
                  {termRunning&&<span className="term-spinner" style={{color:'var(--amber)',fontSize:13}}>◌</span>}
                </div>
              </>}
              {/* Output tab */}
              {bottomTab==='output' && (
                <div className="terminal-body">
                  {outputLines.length===0 && !connected && <div className="term-line"><span className="term-out">SOMA offline — start backend with <code>npm run backend</code></span></div>}
                  {outputLines.length===0 && connected && <div className="term-line"><span className="term-out">Loading…</span></div>}
                  {outputLines.map((l,i)=>(
                    <div key={i} className="term-line">
                      <span className={`term-${l.type||'out'}`}>{l.text}</span>
                    </div>
                  ))}
                </div>
              )}
              {/* Problems tab */}
              {bottomTab==='problems' && (
                <div className="terminal-body">
                  {problemLines===null && (
                    <div className="term-line">
                      <span className="term-out">{connected?'Click to check…':'SOMA offline'}</span>
                      {connected && <button style={{marginLeft:8,padding:'1px 8px',fontSize:11,background:'var(--s3)',border:'1px solid var(--border)',borderRadius:4,color:'var(--text)',cursor:'pointer'}} onClick={runProblemsCheck}>Run check</button>}
                    </div>
                  )}
                  {problemLines!==null && problemLines.length===0 && <div className="term-line"><span className="term-info">Checking…</span></div>}
                  {(problemLines||[]).map((l,i)=>(
                    <div key={i} className="term-line">
                      <span className={`term-${l.type||'out'}`}>{l.type==='err'?'✕ ':l.type==='info'?'ℹ ':''}{l.text}</span>
                    </div>
                  ))}
                  {problemLines!==null && problemLines.length>0 && (
                    <div className="term-line" style={{marginTop:4}}>
                      <button style={{padding:'1px 8px',fontSize:11,background:'var(--s3)',border:'1px solid var(--border)',borderRadius:4,color:'var(--muted)',cursor:'pointer'}} onClick={()=>{setProblemLines(null);setProblemCount(0);runProblemsCheck();}}>Re-check</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
          {!showBottom&&(
            <div style={{borderTop:'1px solid var(--border)',padding:'0 12px',height:28,display:'flex',alignItems:'center',gap:8,background:'var(--s1)',flexShrink:0}}>
              <button className="bp-tab" style={{border:'none',background:'transparent',cursor:'pointer',display:'flex',alignItems:'center',gap:5}} onClick={()=>setShowBottom(true)}>
                {ICONS.terminal} Terminal
              </button>
            </div>
          )}
        </div>

        {/* ── SOMA / Steve chat panel ── */}
        <div className="max-panel" style={showPreview ? {borderColor:'rgba(16,185,129,0.35)'} : {}}>
          <div className="mp-header">
            <div className="mp-title" style={showPreview ? {color:'#34d399'} : {}}>{showPreview ? 'STEVE' : 'SOMA'}</div>
            {showPreview && steveBuildState === 'generating' && (
              <div style={{marginLeft:8,display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#6ee7b7',fontFamily:'var(--mono)'}}>
                <span style={{display:'inline-block',animation:'spin 1s linear infinite',fontSize:11}}>◌</span>
                generating…
              </div>
            )}
            {showPreview && steveBuildState === 'ready' && (
              <div style={{marginLeft:8,fontSize:10,color:'#34d399',fontFamily:'var(--mono)'}}>● ready to publish</div>
            )}
            {showPreview && steveBuildState === 'published' && (
              <div style={{marginLeft:8,fontSize:10,color:'#34d399',fontFamily:'var(--mono)'}}>✓ {steveBuildAddress}</div>
            )}
            <div style={{flex:1}}/>
            <div className="mp-mode">
              {!showPreview && (
                <>
                  <button className={`mp-mode-btn ${chatMode==='swarm'?'active':''}`} onClick={()=>setChatMode(m=>m==='swarm'?null:'swarm')}>
                    <span style={{display:'inline-flex',verticalAlign:'middle',marginRight:3}}>{ICONS.bolt}</span> Swarm
                  </button>
                  <button className={`mp-mode-btn ${chatMode==='debate'?'active':''}`} onClick={()=>setChatMode(m=>m==='debate'?null:'debate')}>
                    ⚖ Debate
                  </button>
                </>
              )}
            </div>
          </div>
          {/* Token savings bar — hidden in Steve mode */}
          {!showPreview && (
            <div className="savings-bar">
              <span className="sb-saved">{ICONS.bolt} {savings.totalLocal} local</span>
              <div className="sb-track"><div className="sb-fill" style={{width:(savings.totalAll>0?(savings.totalLocal/savings.totalAll*100):0)+'%'}}/></div>
              <span className="sb-label">{savings.totalAll>0?Math.round(savings.totalLocal/savings.totalAll*100):0}% free</span>
            </div>
          )}
          {/* Your Sites strip — Steve mode */}
          {showPreview && stevePublishedSites.length > 0 && (
            <div className="steve-sites-strip">
              {stevePublishedSites.map(s => (
                <SitePill key={s.address} name={s.name} address={s.address}/>
              ))}
            </div>
          )}
          {insight&&!showPreview&&(
            <div style={{padding:'6px 14px',flexShrink:0}}>
              <div className="insight"><div className="ins-label">Insight</div>{insight}</div>
            </div>
          )}
          <div className="mp-messages">
            {(showPreview ? steveMessages : messages).map(msg=>
              msg.role==='activity'
                ? <AgentActivityMessage key={msg.id} msg={msg}/>
                : <MaxMsg key={msg.id} msg={msg} pendingChanges={pendingChanges} setPendingChanges={setPendingChanges} setActiveTab={setActiveTab}
                    onStevePublish={showPreview && steveBuildState === 'ready' ? stevePublishSite : null}
                    onAcceptPending={handleAcceptPendingChange}
                    onRejectPending={handleRejectPendingChange}/>
            )}
            {isThinking && <Thinking label={thinkLabel} onAbort={handleAbort}/>}
            <div ref={messagesEndRef}/>
          </div>
          {/* Quick-reply chips — Steve interview mode */}
          {showPreview && !steveBuildState && steveMessages.length > 0 && (() => {
            const last = steveMessages[steveMessages.length - 1];
            if (last.role !== 'max' || !last.text?.includes('?')) return null;
            const q = last.text.toLowerCase();
            const styleQ = /style|tone|look|aesthetic|feel|design|visual|minimal|bold|color|dark|clean/.test(q);
            const typeQ = /type|kind|what kind|portfolio|business|knowledge|saas|site type/.test(q);
            if (!styleQ && !typeQ) return null;
            const chips = styleQ
              ? ['Clean & minimal','Dark editorial','Bold colorful','Technical dense']
              : ['Portfolio / Personal','Business / Services','Knowledge / Wiki','SaaS / Product'];
            return (
              <div className="steve-chips">
                {chips.map(c=>(
                  <button key={c} className="steve-chip" onClick={()=>sendMessage(c)}>{c}</button>
                ))}
              </div>
            );
          })()}

          <AgentTaskBar task={agentTask}/>
          {!connected&&(
            <div style={{padding:'6px 14px',flexShrink:0}}>
              <div style={{background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.2)',borderRadius:6,padding:'6px 10px',fontSize:11.5,color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}>
                <span style={{color:'var(--red)',display:'flex'}}>{ICONS.dot}</span>
                SOMA offline — <code style={{background:'var(--s3)',padding:'1px 4px',borderRadius:3,color:'var(--text)',fontFamily:'var(--mono)',fontSize:10.5}}>npm run backend</code>
              </div>
            </div>
          )}
          <div className="mp-input-wrap" style={{position:'relative'}}>
            {chatMode&&(
              <div className="cmd-mode-badge">
                {chatMode==='swarm'?<span style={{display:'inline-flex'}}>{ICONS.bolt}</span>:'⚖'} {chatMode.toUpperCase()}
                <button onClick={()=>setChatMode(null)} style={{display:'flex'}}>{ICONS.close}</button>
              </div>
            )}
            {slashSuggestions.length>0&&(
              <div className="slash-picker">
                {slashSuggestions.map((s,i)=>(
                  <div key={s.cmd} className={`slash-item ${i===slashIdx?'sel':''}`} onMouseDown={()=>{setInput(s.cmd+' ');setSlashSuggestions([]);inputRef.current?.focus();}}>
                    <span className="sc-cmd">{s.cmd}</span>
                    <span className="sc-desc">{s.desc}</span>
                  </div>
                ))}
              </div>
            )}
            <div className="input-row">
              <textarea ref={inputRef} className="mp-textarea"
                placeholder={chatMode?`${chatMode} mode — describe your task…`:showPreview?"Tell Steve what to build…":"Talk to SOMA… or /command"}
                value={input} onChange={handleInputChange} onKeyDown={handleKeyDown} rows={1}
                onInput={e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px';}}
              />
              {isThinking ? (
                <button className="send-btn stop-btn" onClick={handleAbort} style={{display:'flex',alignItems:'center',justifyContent:'center',backgroundColor:'#ef4444',color:'white'}} title="Stop Generation">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h12V5H6v14z"/></svg>
                </button>
              ) : (
                <button className="send-btn" onClick={()=>sendMessage()} disabled={!input.trim()} style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {ICONS.send}
                </button>
              )}
            </div>
          </div>
        </div>

        {/* ── Overview panel ── */}
        <div className={`overview-panel ${showOverview?'':'collapsed'}`}>
          <div className="ov-header">Overview</div>
          <OverviewPanel
            connected={connected}
            maxUrl={maxUrl}
            goals={goals}
            onStopTask={stopTask}
            onOpenFile={f => openFile({ name: f.split('/').pop(), path: f })}
          />
        </div>
      </div>
      {/* ── Status bar ── */}
      <StatusBar
        connected={connected} maxStatus={maxStatus} goals={goals}
        activeTab={activeTab} saveStatus={saveStatus} gitBranch={gitBranch}
        persona={persona} problemCount={problemCount} langOverride={langOverride}
        isThinking={isThinking} thinkLabel={thinkLabel}
        onClickGit={()=>{setSideTab('git');setSidebarOpen(true);}}
        onClickGoals={()=>{setSideTab('goals');setSidebarOpen(true);}}
        onClickErrors={()=>{setBottomTab('problems');setShowBottom(true);}}
        onClickMemory={()=>setShowSettings(true)}
        onClickLang={()=>setShowLangPicker(l=>!l)}
        onClickShortcuts={()=>setShowShortcuts(true)}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
