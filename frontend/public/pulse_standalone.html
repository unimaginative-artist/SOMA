// ── Task complexity classifier ────────────────────────────────
function classifyTask(text) {
  const t = text.toLowerCase();
  const simpleKws = ['what is','what are','explain','how does','list','show','tell me','hi','hello','thanks','what version','status','help'];
  const complexKws = ['build','implement','create','write','refactor','fix','debug','add','migrate','deploy','test','generate','architect','optimize','scale'];
  if (simpleKws.some(k => t.includes(k))) return 'local';
  if (complexKws.some(k => t.includes(k))) return 'cloud';
  if (text.length < 60) return 'local';
  return 'cloud';
}

// Resolve selectedOption → { tier, model } for the API call
function resolveModelChoice(selectedOption, messageText) {
  if (selectedOption.startsWith('auto:')) {
    const band = selectedOption.split(':')[1]; // fast | smart | genius
    if (band === 'genius') return { tier: 'genius', model: undefined };
    // For fast/smart, classify the message — can downgrade fast→fast, smart can also go fast for trivial
    const complexity = classifyTask(messageText);
    const tier = (band === 'smart' && complexity === 'cloud') ? 'smart'
               : (band === 'smart') ? 'fast'
               : 'fast';
    return { tier, model: undefined };
  }
  const opt = getOptionById(selectedOption);
  return { tier: opt.tier, model: selectedOption };
}

function modelBadgeClass(tier) {
  if (tier === 'fast')   return 'mmb-local';
  if (tier === 'genius') return 'mmb-genius';
  return 'mmb-cloud';
}

function modelBadgeLabel(tier, optionId) {
  const opt = getOptionById(optionId || '');
  if (tier === 'fast') return '⚡ local';
  return (opt?.icon || '◎') + ' ' + (opt?.label || tier);
}

// ── Setup Wizard ──────────────────────────────────────────────
function SetupWizard({ onDismiss }) {
  const [step, setStep] = React.useState(0);
  const [ollamaStatus, setOllamaStatus] = React.useState('checking'); // checking|missing|installed
  const [pulling, setPulling] = React.useState(false);
  const [pulled, setPulled] = React.useState(false);
  const [pullProgress, setPullProgress] = React.useState('');

  React.useEffect(() => {
    fetch('http://localhost:11434/api/tags', { signal: AbortSignal.timeout(2000) })
      .then(r => r.ok ? setOllamaStatus('installed') : setOllamaStatus('missing'))
      .catch(() => setOllamaStatus('missing'));
  }, []);

  React.useEffect(() => {
    if (ollamaStatus === 'installed' && step === 0) setStep(1);
  }, [ollamaStatus]);

  const pullModel = async () => {
    setPulling(true); setPullProgress('Starting download…');
    try {
      const r = await fetch('http://localhost:11434/api/pull', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'qwen3:1.5b', stream: true })
      });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const ev = JSON.parse(line);
            if (ev.total && ev.completed) {
              const pct = Math.round((ev.completed / ev.total) * 100);
              setPullProgress(`${ev.status || 'pulling'} ${pct}%`);
            } else if (ev.status) {
              setPullProgress(ev.status);
              if (ev.status === 'success') { setPulled(true); setStep(2); break; }
            }
          } catch {}
        }
      }
      setPulled(true); setStep(2);
    } catch (e) {
      setPullProgress('Error: ' + e.message + ' — check Ollama is running');
    } finally {
      setPulling(false);
    }
  };

  const steps = [
    {
      title: 'Install Ollama',
      desc: 'Ollama runs AI models locally on your machine — free, private, no API key needed. Required for the local fast tier.',
      action: ollamaStatus === 'installed' ? null : (
        <div className="step-action">
          <a href="https://ollama.com/download" target="_blank" rel="noopener"><button className="step-btn step-btn-primary">Download Ollama ↗</button></a>
          <button className="step-btn step-btn-secondary" onClick={() => { setOllamaStatus('installed'); setStep(1); }}>Already installed</button>
        </div>
      ),
      status: ollamaStatus === 'installed' ? 'done' : step === 0 ? 'active' : 'pending',
      doneLabel: 'Ollama detected at localhost:11434',
    },
    {
      title: 'Pull recommended model',
      desc: 'qwen3:1.5b is a fast, capable 1GB model — handles everyday tasks instantly with zero token cost.',
      action: step >= 1 && !pulled ? (
        <div className="step-action">
          {pulling
            ? <div className="step-progress">◎ {pullProgress || 'Pulling qwen3:1.5b…'}</div>
            : <button className="step-btn step-btn-primary" onClick={pullModel}>Pull qwen3:1.5b</button>}
          <span style={{fontSize:11,color:'var(--muted)'}}>~1 GB download</span>
        </div>
      ) : null,
      status: pulled ? 'done' : step === 1 ? 'active' : 'pending',
      doneLabel: 'qwen3:1.5b ready',
    },
    {
      title: 'Start saving tokens',
      desc: 'Auto-route mode is now active. Simple questions and tasks run locally for free. Complex coding uses your cloud API.',
      action: step === 2 ? (
        <div className="step-action">
          <div className="auto-badge">🔄 Auto-route enabled</div>
        </div>
      ) : null,
      status: step === 2 ? 'done' : 'pending',
      doneLabel: 'Auto-routing active',
    },
  ];

  return (
    <div className="setup-modal">
      <div className="setup-card">
        <div className="setup-header">
          <h2>⚡ Set up local AI</h2>
          <p>Pulse uses a local model for everyday tasks — saving your cloud API credits for complex work. Setup takes about 2 minutes.</p>
        </div>
        <div className="setup-steps">
          {steps.map((s, i) => (
            <div key={i} className={`setup-step ${s.status}`}>
              <div className="step-num">{s.status === 'done' ? '✓' : i + 1}</div>
              <div className="step-content">
                <div className="step-title">{s.title}</div>
                <div className="step-desc">{s.desc}</div>
                {s.status === 'done' && <div className="step-done-label" style={{marginTop:5}}>✓ {s.doneLabel}</div>}
                {s.action}
              </div>
            </div>
          ))}
        </div>
        <div className="setup-footer">
          <span style={{fontSize:11.5,color:'var(--muted)'}}>
            {step < 2 ? 'You can skip this and configure later in Settings → Models' : 'All set! Refresh anytime in Settings → Models'}
          </span>
          <button className="step-btn step-btn-secondary" onClick={onDismiss}>
            {step === 2 ? 'Done' : 'Skip for now'}
          </button>
        </div>
      </div>
    </div>
  );
}


// ── Command palette ───────────────────────────────────────────
const PALETTE_CMDS = [
  { type:'cmd', icon:'bolt',     label:'/swarm',   hint:'Parallel swarm job',       action:'swarm'   },
  { type:'cmd', icon:'warning',  label:'/debate',  hint:'Adversarial debate',        action:'debate'  },
  { type:'cmd', icon:'settings', label:'/reflect', hint:'Force deep reflection',     action:'reflect' },
  { type:'cmd', icon:'target',   label:'/goals',   hint:'List active goals',         action:'goals'   },
  { type:'cmd', icon:'terminal', label:'/status',  hint:'Full internal state',       action:'status'  },
  { type:'cmd', icon:'search',   label:'/inspect', hint:'Scan TODOs/FIXMEs',        action:'inspect' },
];

function CommandPalette({ files, onOpenFile, onRunCmd, onClose }) {
  const [q, setQ] = React.useState(window.__paletteInitialQuery || '');
  const [selIdx, setSelIdx] = React.useState(0);
  const [serverSymbols, setServerSymbols] = React.useState([]);
  const inputRef = React.useRef(null);
  
  React.useEffect(()=>{ 
    if (window.__paletteInitialQuery) { window.__paletteInitialQuery = null; }
    inputRef.current?.focus(); 
  }, []);

  React.useEffect(() => {
    if (q.startsWith('@') && q.length > 1) {
      const term = q.slice(1);
      fetch('/api/pulse/ast/symbols?limit=25&query=' + encodeURIComponent(term))
        .then(r=>r.json()).then(d=>{ if(d.success) setServerSymbols(d.symbols); });
    } else { setServerSymbols([]); }
  }, [q]);

  const isSym = q.startsWith('@');
  const flatAll = (arr) => (arr||[]).flatMap(f => f.type==='dir' ? flatAll(f.children||[]) : [f]);
  const allFiles = flatAll(files);
  const fileItems = isSym ? [] : allFiles
    .filter(f => !q || f.name.toLowerCase().includes(q.toLowerCase()))
    .slice(0, 30)
    .map(f => ({ type:'file', icon:'file', label:f.name, f }));
  const cmdItems = isSym ? [] : PALETTE_CMDS
    .filter(c => !q || c.label.includes(q.toLowerCase()) || c.hint.toLowerCase().includes(q.toLowerCase()));
  const symItems = isSym ? serverSymbols.map(s => ({
    type:'symbol', icon:'code', label: `${s.name} (${s.type})`, hint: s.file_path, 
    f: { name: s.file_path.split('/').pop(), path: s.file_path, line: s.start_line }
  })) : [];
  
  const allItems = [...fileItems, ...symItems, ...cmdItems];

  const onKey = e => {
    if (e.key==='ArrowDown'){ e.preventDefault(); setSelIdx(i=>Math.min(i+1,allItems.length-1)); }
    if (e.key==='ArrowUp')  { e.preventDefault(); setSelIdx(i=>Math.max(i-1,0)); }
    if (e.key==='Escape') onClose();
    if (e.key==='Enter') { e.preventDefault(); pick(allItems[selIdx]); }
  };

  const pick = item => {
    if (!item) return;
    if (item.type==='file' || item.type==='symbol') onOpenFile(item.f);
    else onRunCmd(item.action);
    onClose();
  };

  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette-box" onClick={e=>e.stopPropagation()}>
        <div className="palette-input-row">
          <span style={{display:'flex',color:'var(--muted)'}}>{ICONS.search}</span>
          <input ref={inputRef} className="palette-input" placeholder="Search files (@ for symbols), run commands…"
            value={q} onChange={e=>{setQ(e.target.value);setSelIdx(0);}} onKeyDown={onKey}/>
          <span style={{fontSize:11,color:'var(--muted2)',fontFamily:'var(--mono)'}}>Esc</span>
        </div>
        <div className="palette-results">
          {fileItems.length>0 && <>
            <div className="palette-section-label">Files</div>
            {fileItems.map((item,i)=>(
              <div key={`file-${i}`} className={`palette-item ${selIdx===i?'sel':''}`} onClick={()=>pick(item)}>
                <span className="pi-icon">{ICONS.file}</span>
                <span className="pi-label">{item.label}</span>
                <span className="pi-badge">open</span>
              </div>
            ))}
          </>}
          {symItems.length>0 && <>
            <div className="palette-section-label">Symbols</div>
            {symItems.map((item,i)=>{
              const globalIdx = fileItems.length+i;
              return (
                <div key={`sym-${i}`} className={`palette-item ${selIdx===globalIdx?'sel':''}`} onClick={()=>pick(item)}>
                  <span className="pi-icon" style={{color:'var(--accent)'}}>{ICONS.code||'<>'}</span>
                  <span className="pi-label">{item.label}</span>
                  <span className="pi-hint" style={{fontSize:11}}>{item.hint}:{item.f.line}</span>
                </div>
              );
            })}
          </>}
          {cmdItems.length>0 && <>
            <div className="palette-section-label">Commands</div>
            {cmdItems.map((item,i)=>{
              const globalIdx = fileItems.length+symItems.length+i;
              return (
                <div key={`cmd-${i}`} className={`palette-item ${selIdx===globalIdx?'sel':''}`} onClick={()=>pick(item)}>
                  <span className="pi-icon">{ICONS[item.icon]||ICONS.bolt}</span>
                  <span className="pi-label">{item.label}</span>
                  <span className="pi-hint">{item.hint}</span>
                </div>
              );
            })}
          </>}
          {allItems.length===0 && <div style={{padding:'20px 16px',fontSize:12.5,color:'var(--muted)',textAlign:'center'}}>No results for "{q}"</div>}
        </div>
        <div className="palette-footer">
          <span><kbd>↑↓</kbd> navigate</span>
          <span><kbd>Enter</kbd> open</span>
          <span><kbd>Esc</kbd> close</span>
          <span style={{marginLeft:'auto'}}><kbd>Ctrl</kbd>+<kbd>P</kbd> to search symbols</span>
        </div>
      </div>
    </div>
  );
}


// ── Git Panel ─────────────────────────────────────────────────
function GitPanel({ connected, maxUrl, gitStaged, setGitStaged, openFile, onRunInTerminal, onChangedCount }) {
  const [gitFiles, setGitFiles] = React.useState([]);
  const [commitMsg, setCommitMsg] = React.useState('');
  const [gitLoading, setGitLoading] = React.useState(false);
  const [gitBranch, setGitBranch] = React.useState('main');
  const [gitLog, setGitLog] = React.useState([]);
  const [showLog, setShowLog] = React.useState(false);

  const runGit = React.useCallback(async (cmd) => {
    if (!connected) return null;
    try {
      const r = await fetch(maxUrl + '/api/tools/shell/run', {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: cmd, timeoutMs: 10000 })
      });
      const d = await r.json();
      return d.stdout || d.output || '';
    } catch { return null; }
  }, [connected, maxUrl]);

  const refresh = React.useCallback(async () => {
    setGitLoading(true);
    const status = await runGit('git status --porcelain');
    if (status !== null) {
      const files = status.split('\n').filter(Boolean).map(l => ({
        status: l.slice(0,2).trim() || '?',
        file: l.slice(3).trim()
      }));
      setGitFiles(files.length ? files : []);
      onChangedCount?.(files.length);
    } else {
      setGitFiles([]);
      onChangedCount?.(0);
    }
    const branch = await runGit('git branch --show-current');
    if (branch) setGitBranch(branch.trim());
    setGitLoading(false);
  }, [runGit]);

  React.useEffect(() => { refresh(); }, [connected]);

  const commit = async () => {
    if (!commitMsg.trim()) return;
    const stagedFiles = gitFiles.filter(f => gitStaged[f.file]);
    if (stagedFiles.length === 0) { alert('No files staged. Check the checkboxes first.'); return; }
    const escFile = f => `'${f.file.replace(/'/g,"'\\''")}'`;
    const escMsg  = commitMsg.replace(/'/g,"'\\''");
    onRunInTerminal(`git add ${stagedFiles.map(escFile).join(' ')} && git commit -m '${escMsg}'`);
    setCommitMsg('');
    setTimeout(refresh, 1500);
  };

  const stageAll = () => {
    const all = {};
    gitFiles.forEach(f => all[f.file] = true);
    setGitStaged(all);
  };

  const stagedCount = gitFiles.filter(f => gitStaged[f.file]).length;

  const statusColor = s => s==='M'?'var(--amber)':s==='A'?'var(--green)':s==='D'?'var(--red)':s==='?'?'var(--muted)':'var(--muted)';
  const statusLabel = s => s==='M'?'M':s==='A'?'A':s==='D'?'D':s==='??'?'U':s||'?';

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      {/* Header */}
      <div className="sb-header">
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {ICONS.git}
          <span style={{fontWeight:600}}>Git</span>
          <span style={{fontSize:10,color:'var(--accent2)',fontFamily:'var(--mono)',background:'var(--s4)',padding:'1px 6px',borderRadius:10,border:'1px solid var(--border)'}}>{gitBranch}</span>
        </div>
        <button className="sb-icon-btn" title="Refresh" onClick={refresh} style={{opacity:gitLoading?.5:1}}>{ICONS.reload}</button>
      </div>

      {/* Commit area */}
      <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <textarea className="add-goal-input"
          style={{width:'100%',resize:'none',height:52,marginBottom:6,padding:'5px 8px',boxSizing:'border-box',fontFamily:'inherit',fontSize:11.5,lineHeight:1.5}}
          placeholder="Commit message…" value={commitMsg}
          onChange={e=>setCommitMsg(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))commit();}}/>
        <div style={{display:'flex',gap:5,alignItems:'center'}}>
          <button onClick={stageAll} style={{flex:1,fontSize:10.5,color:'var(--muted)',background:'var(--s3)',border:'1px solid var(--border)',borderRadius:4,padding:'3px 0',cursor:'pointer',whiteSpace:'nowrap'}}>
            Stage all <span style={{color:'var(--accent2)'}}>{gitFiles.length}</span>
          </button>
          <button onClick={()=>setGitStaged({})} style={{fontSize:10.5,color:'var(--muted)',background:'none',border:'1px solid var(--border)',borderRadius:4,padding:'3px 8px',cursor:'pointer'}}>
            Clear
          </button>
          <button onClick={commit}
            style={{flex:1,fontSize:11,fontWeight:600,
              background:commitMsg.trim()&&stagedCount>0?'var(--accent)':'var(--s3)',
              color:commitMsg.trim()&&stagedCount>0?'#fff':'var(--muted)',
              border:'none',borderRadius:4,padding:'4px 0',cursor:'pointer',
              opacity:commitMsg.trim()&&stagedCount>0?1:.5,
              display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
            {ICONS.check} Commit{stagedCount>0?` ${stagedCount}`:''}
          </button>
        </div>
      </div>

      {/* File list */}
      <div className="sb-scroll" style={{flex:1}}>
        {gitLoading && <div style={{padding:'14px 12px',fontSize:11.5,color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}><span className="term-spinner">◌</span> Refreshing…</div>}
        {!gitLoading && gitFiles.length===0 && (
          <div style={{padding:'20px 12px',fontSize:11.5,color:'var(--muted)',textAlign:'center',lineHeight:1.7}}>
            {connected ? <>{ICONS.check}<br/>No changes detected</> : 'Connect SOMA to see git status'}
          </div>
        )}
        {!gitLoading && gitFiles.map((f,i)=>{
          const fname = f.file.split('/').pop();
          const fdir  = f.file.includes('/') ? f.file.slice(0, f.file.lastIndexOf('/')) : '';
          return (
            <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',cursor:'pointer',borderRadius:4,margin:'1px 4px'}}
              onClick={()=>openFile({name:fname,path:f.file,type:'file'})}
              onMouseEnter={e=>e.currentTarget.style.background='var(--s3)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <span style={{width:14,height:14,borderRadius:3,background:'var(--s4)',border:`1px solid ${statusColor(statusLabel(f.status))}`,
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:700,
                color:statusColor(statusLabel(f.status)),flexShrink:0,fontFamily:'var(--mono)'}}>
                {statusLabel(f.status)}
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11.5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--fg)'}}>{fname}</div>
                {fdir && <div style={{fontSize:9.5,color:'var(--muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fdir}</div>}
              </div>
              <input type="checkbox" checked={!!gitStaged[f.file]}
                onChange={e=>setGitStaged(s=>({...s,[f.file]:e.target.checked}))}
                onClick={e=>e.stopPropagation()} style={{accentColor:'var(--accent)',flexShrink:0,width:13,height:13}}/>
            </div>
          );
        })}
      </div>

      {/* Log toggle */}
      <div style={{borderTop:'1px solid var(--border)',flexShrink:0}}>
        <button onClick={()=>{setShowLog(s=>!s);if(!showLog)runGit('git log --oneline -10').then(l=>setGitLog(l?l.split('\n').filter(Boolean):[]));}}
          style={{width:'100%',padding:'5px 10px',background:'none',border:'none',color:'var(--muted)',fontSize:10.5,cursor:'pointer',display:'flex',alignItems:'center',gap:4,justifyContent:'center'}}>
          {showLog?ICONS.logUp:ICONS.logDown} {showLog?'Hide log':'Git log'}
        </button>
        {showLog && (

// ── Subtle sound effects ──────────────────────────────────────
function playTone(freq, duration, vol, type='sine') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch {}
}

function playStevePop() {

  playTone(523, 0.12, 0.06);

// ── Find in files panel ───────────────────────────────────────
function FindInFiles({ connected, maxUrl, onOpenFile, onClose }) {
  const [q, setQ] = React.useState('');
  const [results, setResults] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const inputRef = React.useRef(null);
  React.useEffect(() => { inputRef.current?.focus(); }, []);

  const search = React.useCallback(async (query) => {
    if (!query.trim() || !connected) return;
    setLoading(true); setResults(null);
    try {
      const escaped = query.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
      // Cross-platform Node.js search — no grep dependency
      const script = `
const fs=require('fs'),path=require('path');
const q=${JSON.stringify(query.toLowerCase())};
const SKIP=new Set(['node_modules','.git','dist','build','coverage','.next']);
const EXT=new Set(['.ts','.js','.tsx','.jsx','.json','.md','.css','.html','.py','.go','.rs','.sh','.env']);
const out=[];
function walk(dir,depth){
  if(depth>6)return;
  let en;try{en=fs.readdirSync(dir,{withFileTypes:true})}catch{return}
  for(const e of en){
    if(SKIP.has(e.name)||e.name.startsWith('.'))continue;
    const full=path.join(dir,e.name);
    if(e.isDirectory())walk(full,depth+1);
    else if(EXT.has(path.extname(e.name).toLowerCase())){
      try{
        const lines=fs.readFileSync(full,'utf8').split('\\n');
        lines.forEach((l,i)=>{if(l.toLowerCase().includes(q))out.push(full.replace(/\\\\/g,'/')+'::'+(i+1)+'::'+l.trim().slice(0,120))});
      }catch{}
    }
    if(out.length>=60)return;
  }
}
walk('.',0);out.forEach(r=>console.log(r));`;
      const r = await fetch(`${maxUrl}/api/tools/shell/run`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: `node -e ${JSON.stringify(script)}`, timeoutMs:15000 })
      });
      const d = await r.json();
      const raw = (d.stdout || d.output || '').trim();
      if (!raw) { setResults([]); setLoading(false); return; }
      const parsed = raw.split('\n').filter(Boolean).map(line => {
        const parts = line.split('::');
        if (parts.length >= 3) return { file: parts[0].replace(/^\.\//,''), line: parseInt(parts[1]), text: parts.slice(2).join('::') };
        return null;
      }).filter(Boolean);
      // Group by file
      const grouped = {};
      parsed.forEach(r => { if (!grouped[r.file]) grouped[r.file] = []; grouped[r.file].push(r); });
      setResults(grouped);
    } catch { setResults({}); }
    setLoading(false);
  }, [connected, maxUrl]);

  const handleKey = e => { if (e.key === 'Enter') search(q); if (e.key === 'Escape') onClose(); };
  const fileCount = results ? Object.keys(results).length : 0;
  const matchCount = results ? Object.values(results).flat().length : 0;

  return (
    <>
      <div className="sb-header">
        <span>Find in Files</span>
        <button className="sb-icon-btn" onClick={onClose} style={{display:'flex'}}>{ICONS.close}</button>
      </div>
      <div className="search-input-wrap">
        <input ref={inputRef} className="search-input" placeholder="Search… (Enter)" value={q}
          onChange={e=>setQ(e.target.value)} onKeyDown={handleKey}/>
        <div style={{marginTop:5,display:'flex',gap:6,alignItems:'center'}}>
          <button onClick={()=>search(q)} style={{padding:'3px 10px',fontSize:11,background:'var(--accent)',border:'none',borderRadius:4,color:'#fff',cursor:'pointer',fontWeight:600}}>Search</button>
          {results!==null&&<span style={{fontSize:10.5,color:'var(--muted)'}}>{matchCount} matches in {fileCount} files</span>}
          {loading&&<span style={{fontSize:10.5,color:'var(--muted)'}}>◌ searching…</span>}
        </div>
      </div>
      <div className="sb-scroll">
        {results!==null&&matchCount===0&&<div style={{padding:'16px 12px',color:'var(--muted)',fontSize:11.5,textAlign:'center'}}>No results</div>}
        {results&&Object.entries(results).map(([file,lines])=>(
          <div key={file}>
            <div className="search-result-file">{file}</div>
            {lines.map((r,i)=>(
              <div key={i} className="search-result-line" onClick={()=>{
                const name=file.split('/').pop();
                onOpenFile({name,path:file,type:'file'});
              }}>
                <span className="srl-num">{r.line}</span>
                <span className="srl-text">{r.text}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </>
  );
}

function getMonacoLanguage(fileName) {

  const ext = fileName.split('.').pop().toLowerCase();
  const map = {

function MonacoEditor({ fileName, content, onChange, readOnly, langOverride, pendingChange, onAcceptPending, onRejectPending, onInlineGenerate }) {
  const containerRef = React.useRef(null);
  const editorRef    = React.useRef(null);
  const modelRef     = React.useRef(null);
  const inlineInputRef = React.useRef(null);
  const [inlineOpen, setInlineOpen] = React.useState(false);
  const [inlineInput, setInlineInput] = React.useState('');

  const [blastRadius, setBlastRadius] = React.useState(null);
  const [showBlastRadiusDetails, setShowBlastRadiusDetails] = React.useState(false);

  React.useEffect(() => {
    if (pendingChange && pendingChange.status === 'pending') {
      const fileToQuery = pendingChange.file;
      fetch('/api/pulse/ast/blast-radius', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filePath: fileToQuery })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          setBlastRadius(data);
        } else {
          setBlastRadius(null);
        }
      })
      .catch(err => {
        console.warn('Failed to fetch blast radius:', err);
        setBlastRadius(null);
      });
    } else {
      setBlastRadius(null);
      setShowBlastRadiusDetails(false);
    }
  }, [pendingChange]);

  // Apply language override without recreating the editor
  React.useEffect(() => {
    if (langOverride && modelRef.current && window.monaco) {
      const model = modelRef.current.original || modelRef.current;
      window.monaco.editor.setModelLanguage(model, langOverride);
    }
  }, [langOverride]);

  React.useEffect(() => {
    ensureMonaco(() => {
      if (!containerRef.current) return;
      if (editorRef.current) { editorRef.current.dispose(); }
      const lang = langOverride || getMonacoLanguage(fileName);

      if (pendingChange && pendingChange.status === 'pending') {
        const diffEditor = window.monaco.editor.createDiffEditor(containerRef.current, {
          theme: 'maxwell-dark',
          renderSideBySide: false, // INLINE DIFF
          originalEditable: true,
          readOnly: false,
          fontSize: 13,
          fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
          fontLigatures: true,
          lineHeight: 22,
          padding: { top: 40, bottom: 12 },
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          smoothScrolling: true,
          scrollbar: { vertical: 'auto', horizontal: 'auto', verticalScrollbarSize: 6, horizontalScrollbarSize: 6 }
        });

        const originalModel = window.monaco.editor.createModel(content || '', lang);
        const modifiedModel = window.monaco.editor.createModel(pendingChange.content || '', lang);

        diffEditor.setModel({ original: originalModel, modified: modifiedModel });
        editorRef.current = diffEditor;

        let widgets = [];

        const updateHunkWidgets = () => {
          const modifiedEditor = diffEditor.getModifiedEditor();
          widgets.forEach(w => {
            try { modifiedEditor.removeContentWidget(w); } catch(e) {}
          });
          widgets = [];

          const lineChanges = diffEditor.getLineChanges();
          if (!lineChanges) return;

          lineChanges.forEach((change, idx) => {
            const domNode = document.createElement('div');
            domNode.className = 'hunk-action-widget';
            domNode.style.display = 'flex';
            domNode.style.alignItems = 'center';
            domNode.style.gap = '8px';
            domNode.style.padding = '4px 8px';
            domNode.style.background = 'var(--s2)';
            domNode.style.border = '1px solid var(--border)';
            domNode.style.borderRadius = '6px';
            domNode.style.boxShadow = '0 4px 12px rgba(0,0,0,0.5)';
            domNode.style.fontSize = '11px';
            domNode.style.fontFamily = 'var(--sans)';
            domNode.style.zIndex = '50';
            domNode.style.pointerEvents = 'auto';

            const titleSpan = document.createElement('span');
            titleSpan.innerText = `💡 Change Hunk #${idx + 1}`;
            titleSpan.style.color = 'var(--text)';
            titleSpan.style.fontWeight = '600';
            domNode.appendChild(titleSpan);

            const acceptBtn = document.createElement('button');
            acceptBtn.innerText = 'Accept';
            acceptBtn.style.background = '#10b981';
            acceptBtn.style.color = 'white';
            acceptBtn.style.border = 'none';
            acceptBtn.style.borderRadius = '4px';
            acceptBtn.style.padding = '2px 8px';
            acceptBtn.style.cursor = 'pointer';
            acceptBtn.style.fontWeight = '600';
            acceptBtn.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();

              const newText = modifiedModel.getValueInRange(new window.monaco.Range(
                change.modifiedStartLineNumber,
                1,
                change.modifiedEndLineNumber,
                modifiedModel.getLineMaxColumn(change.modifiedEndLineNumber)
              ));

              const range = new window.monaco.Range(
                change.originalStartLineNumber,
                1,
                change.originalEndLineNumber,
                originalModel.getLineMaxColumn(change.originalEndLineNumber)
              );

              originalModel.pushEditOperations([], [{ range, text: newText }], () => null);
            };

            const rejectBtn = document.createElement('button');
            rejectBtn.innerText = 'Reject';

            rejectBtn.style.border = '1px solid rgba(239, 68, 68, 0.4)';

            rejectBtn.style.borderRadius = '4px';
            rejectBtn.style.padding = '2px 8px';
            rejectBtn.style.cursor = 'pointer';
            rejectBtn.style.fontWeight = '600';
            rejectBtn.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();

              const oldText = originalModel.getValueInRange(new window.monaco.Range(
                change.originalStartLineNumber,
                1,
                change.originalEndLineNumber,
                originalModel.getLineMaxColumn(change.originalEndLineNumber)
              ));

              const range = new window.monaco.Range(
                change.modifiedStartLineNumber,
                1,
                change.modifiedEndLineNumber,
                modifiedModel.getLineMaxColumn(change.modifiedEndLineNumber)
              );

              modifiedModel.pushEditOperations([], [{ range, text: oldText }], () => null);
            };
            domNode.appendChild(rejectBtn);

            const w = {
              getId: () => 'hunk-widget-' + idx + '-' + pendingChange.id,
              getDomNode: () => domNode,
              getPosition: () => ({
                position: { lineNumber: change.modifiedStartLineNumber, column: 1 },
                preference: [window.monaco.editor.ContentWidgetPositionPreference.BELOW]
              })
            };

            modifiedEditor.addContentWidget(w);
            widgets.push(w);
          });
        };

        diffEditor.onDidUpdateDiff(updateHunkWidgets);

        originalModel.onDidChangeContent(() => {
          if (onChange) {
            onChange(originalModel.getValue());
          }
        });

        modelRef.current = { original: originalModel, modified: modifiedModel };

      } else {
        const model = window.monaco.editor.createModel(content || '', lang);
        modelRef.current = model;
        const editor = window.monaco.editor.create(containerRef.current, {
          model,
          theme: 'maxwell-dark',
          fontSize: 13,
          fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
          fontLigatures: true,
          lineHeight: 22,
          padding: { top: 12, bottom: 12 },
          minimap: { enabled: true, scale: 1 },
          scrollBeyondLastLine: false,
          smoothScrolling: true,
          cursorBlinking: 'smooth',
          cursorSmoothCaretAnimation: 'on',
          renderLineHighlight: 'gutter',
          bracketPairColorization: { enabled: true },
          guides: { bracketPairs: true, indentation: true },
          suggest: { showKeywords: true, showSnippets: true },
          quickSuggestions: { other: true, comments: false, strings: false },
          parameterHints: { enabled: true },
          formatOnPaste: true,
          tabSize: 2,
          insertSpaces: true,
          wordWrap: 'off',
          readOnly: !!readOnly,
          scrollbar: { vertical: 'auto', horizontal: 'auto', verticalScrollbarSize: 6, horizontalScrollbarSize: 6 },
          overviewRulerLanes: 0,
        });
        editorRef.current = editor;

        window.jumpToLine = (line) => {
          editor.revealLineInCenter(line);
          editor.setPosition({ lineNumber: line, column: 1 });
          editor.focus();
        };

        editor.addCommand(window.monaco.KeyMod.CtrlCmd | window.monaco.KeyCode.KeyP, () => {
          document.dispatchEvent(new CustomEvent('pulse-cmd-palette', { detail: '@' }));
        });

        const openInline = () => {
          setInlineOpen(true);
          setTimeout(() => inlineInputRef.current?.focus(), 50);
        };
        editor.addCommand(window.monaco.KeyMod.CtrlCmd | window.monaco.KeyCode.KeyK, openInline);
        editor.addCommand(window.monaco.KeyMod.CtrlCmd | window.monaco.KeyCode.KeyI, openInline);

        editor.addAction({
          id: 'trace-type-deps',
          label: 'Find All References (Type Level)',
          contextMenuGroupId: 'navigation',
          contextMenuOrder: 1.5,
          run: (ed) => {
            const position = ed.getPosition();
            const word = ed.getModel().getWordAtPosition(position);
            if (word) {
              fetch('/api/pulse/ast/types/trace?typeName=' + encodeURIComponent(word.word))
                .then(r=>r.json()).then(data=>{
                  if (data.success && data.references && data.references.length > 0) {
                     alert(`Found ${data.references.length} usages of type '${data.typeName}'.\n\n` + 
                           data.references.slice(0, 5).map(r => `- ${r.caller} in ${r.filePath}:${r.line}`).join('\n') +
                           (data.references.length > 5 ? '\n...and more' : ''));
                  } else {
                     alert(`No type usages found for '${word.word}'`);
                  }
                });
            }
          }
        });

        if (onChange) {
          model.onDidChangeContent(() => {
            onChange(model.getValue());
          });
        }
      }
    });

    return () => {
      if (editorRef.current) { editorRef.current.dispose(); editorRef.current = null; }
      if (modelRef.current) {
        if (modelRef.current.original) {
          modelRef.current.original.dispose();
          modelRef.current.modified.dispose();
        } else {
          modelRef.current.dispose();
        }
        modelRef.current = null;
      }
    };
  }, [fileName, !!pendingChange]);

  // Update content when it changes externally (file switch)
  React.useEffect(() => {
    if (modelRef.current && content !== undefined) {
      const activeModel = modelRef.current.original || modelRef.current;
      const cur = activeModel.getValue();
      if (cur !== content) {
        activeModel.setValue(content || '');
      }
    }
  }, [content]);

  const isDiffMode = pendingChange && pendingChange.status === 'pending';

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', position:'relative', height:'100%'}}>
      {isDiffMode && (
        <div style={{
          position: 'absolute',
          top: 0, left: 0, right: 0, height: '36px',
          background: 'rgba(30, 30, 40, 0.95)',
          backdropFilter: 'blur(8px)',
          borderBottom: '1px solid var(--border)',
          zIndex: 10,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          padding: '0 16px',
          boxSizing: 'border-box'
        }}>
          <span style={{ fontSize: '11px', fontWeight: 'bold', color: 'var(--amber)', display: 'flex', alignItems: 'center', gap: '6px', fontFamily: 'var(--sans)' }}>
            <span>✨</span> SOMA Code Suggestion Review for {fileName}
            {blastRadius && (blastRadius.blastRadius?.length > 0 || blastRadius.dbImpacts?.length > 0 || blastRadius.routeImpacts?.length > 0) && (
              <span 
                onClick={() => setShowBlastRadiusDetails(!showBlastRadiusDetails)}
                style={{
                  marginLeft: '12px',
                  padding: '2px 8px',
                  borderRadius: '12px',
                  background: blastRadius.blastRadius?.length > 0 ? 'rgba(239, 68, 68, 0.15)' : 'rgba(245, 158, 11, 0.15)',
                  border: `1px solid ${blastRadius.blastRadius?.length > 0 ? 'rgba(239, 68, 68, 0.4)' : 'rgba(245, 158, 11, 0.4)'}`,
                  color: blastRadius.blastRadius?.length > 0 ? '#ef4444' : '#fbbf24',
                  fontSize: '10px',
                  fontWeight: '600',
                  cursor: 'pointer',
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '4px',
                  userSelect: 'none'
                }}
              >
                ⚠️ Blast Radius: {blastRadius.blastRadius?.length || 0} downstream call sites {showBlastRadiusDetails ? '▲' : '▼'}
              </span>
            )}
          </span>
          <div style={{ display: 'flex', gap: '8px' }}>
            <button 
              onClick={() => {
                const currentContent = modelRef.current?.original?.getValue() || modelRef.current?.getValue() || content;
                onAcceptPending({ ...pendingChange, currentOriginalContent: currentContent });
              }}
              style={{
                background: 'linear-gradient(135deg, #10b981, #059669)',
                color: 'white',
                border: 'none',
                borderRadius: '4px',
                padding: '3px 12px',
                fontSize: '11px',
                fontWeight: '600',
                cursor: 'pointer',
                boxShadow: '0 2px 4px rgba(16, 185, 129, 0.2)'
              }}
            >
              Accept All
            </button>
            <button 
              onClick={() => onRejectPending(pendingChange)}
              style={{
                background: 'rgba(239, 68, 68, 0.15)',
                border: '1px solid rgba(239, 68, 68, 0.4)',
                color: '#ef4444',
                borderRadius: '4px',
                padding: '2px 12px',
                fontSize: '11px',
                fontWeight: '600',
                cursor: 'pointer'
              }}
            >
              Reject All
            </button>
          </div>
        </div>
      )}
      {isDiffMode && showBlastRadiusDetails && blastRadius && (
        <div style={{
          position: 'absolute',
          top: '40px',
          left: '16px',
          width: '380px',
          maxHeight: '300px',
          overflowY: 'auto',
          background: 'rgba(24, 24, 32, 0.98)',
          border: '1px solid var(--border)',
          borderRadius: '8px',
          boxShadow: '0 12px 32px rgba(0,0,0,0.7)',
          zIndex: 99,
          padding: '12px',
          fontSize: '11px',
          fontFamily: 'var(--sans)',
          color: 'var(--text)'
        }}>
          <div style={{ fontWeight: 'bold', marginBottom: '8px', borderBottom: '1px solid var(--border)', paddingBottom: '4px', display: 'flex', justifyContent: 'space-between' }}>
            <span>📦 Downstream Impact Map</span>
            <button 
              onClick={() => setShowBlastRadiusDetails(false)}
              style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer', fontSize: '12px' }}
            >
              ✕
            </button>
          </div>
          
          {blastRadius.modifiedSymbols?.length > 0 && (
            <div style={{ marginBottom: '10px' }}>
              <div style={{ color: 'var(--muted)', fontWeight: '600', marginBottom: '3px' }}>Modified Symbols:</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                {blastRadius.modifiedSymbols.map((s, idx) => (
                  <span key={idx} style={{ fontFamily: 'var(--mono)', fontSize: '10px', background: 'rgba(255,255,255,0.06)', padding: '1px 6px', borderRadius: '4px' }}>
                    {s.name} ({s.type})
                  </span>
                ))}
              </div>
            </div>
          )}

          {blastRadius.dbImpacts?.length > 0 && (
            <div style={{ marginBottom: '10px', padding: '6px', background: 'rgba(245, 158, 11, 0.08)', border: '1px solid rgba(245, 158, 11, 0.25)', borderRadius: '4px' }}>
              <div style={{ color: '#fbbf24', fontWeight: 'bold', display: 'flex', alignItems: 'center', gap: '4px', marginBottom: '3px' }}>
                <span>🗄️</span> Database Impact Detected:
              </div>
              {blastRadius.dbImpacts.map((path, idx) => (
                <div key={idx} style={{ fontFamily: 'var(--mono)', fontSize: '10px', color: 'var(--muted)' }}>• {path}</div>
              ))}
            </div>
          )}

          {blastRadius.routeImpacts?.length > 0 && (
            <div style={{ marginBottom: '10px', padding: '6px', background: 'rgba(96, 165, 250, 0.08)', border: '1px solid rgba(96, 165, 250, 0.25)', borderRadius: '4px' }}>
              <div style={{ color: '#60a5fa', fontWeight: 'bold', display: 'flex', alignItems: 'center', gap: '4px', marginBottom: '3px' }}>
                <span>🌐</span> API Route Impact Detected:
              </div>
              {blastRadius.routeImpacts.map((path, idx) => (
                <div key={idx} style={{ fontFamily: 'var(--mono)', fontSize: '10px', color: 'var(--muted)' }}>• {path}</div>
              ))}
            </div>
          )}

          {blastRadius.blastRadius?.length > 0 ? (
            <div>
              <div style={{ color: '#ef4444', fontWeight: '600', marginBottom: '4px' }}>Downstream Call Sites:</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                {blastRadius.blastRadius.map((item, idx) => (
                  <div key={idx} style={{ padding: '4px 6px', background: 'rgba(239, 68, 68, 0.04)', borderLeft: '2px solid #ef4444', borderRadius: '0 4px 4px 0' }}>
                    <div style={{ fontWeight: 'bold', display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ fontFamily: 'var(--mono)' }}>{item.callerName}()</span>
                      <span style={{ color: 'var(--muted)', fontSize: '10px' }}>calls {item.calleeSymbol}</span>
                    </div>
                    <div style={{ color: 'var(--muted)', fontSize: '10px', fontFamily: 'var(--mono)' }}>
                      {item.filePath}:{item.lineNumber}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div style={{ color: '#34d399', fontSize: '10px', fontStyle: 'italic', marginTop: '6px' }}>
              No downstream callers affected in the codebase. Safe write.
            </div>
          )}
        </div>
      )}

      {inlineOpen && (
        <div style={{
          position: 'absolute', top: '15%', left: '50%', transform: 'translateX(-50%)',
          width: 450, background: 'var(--bg)', border: '1px solid var(--border)',
          borderRadius: 8, boxShadow: '0 12px 40px rgba(0,0,0,0.8)', zIndex: 100,
          display: 'flex', flexDirection: 'column', overflow: 'hidden'
        }}>
          <div style={{ padding: '8px 12px', background: 'var(--s2)', borderBottom: '1px solid var(--border)', fontSize: 11, color: 'var(--muted)', display: 'flex', justifyContent: 'space-between' }}>
            <span>{ICONS.bolt} Generate Inline (Cmd+K)</span>
            <span style={{ cursor: 'pointer' }} onClick={() => setInlineOpen(false)}>{ICONS.close}</span>
          </div>
          <input 
            ref={inlineInputRef}
            style={{ width: '100%', padding: '12px', background: 'transparent', border: 'none', color: 'var(--text)', outline: 'none', fontFamily: 'var(--ui)', fontSize: 13 }}
            placeholder="What should SOMA build here?"
            value={inlineInput}
            onChange={e => setInlineInput(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Escape') setInlineOpen(false);
              if (e.key === 'Enter' && inlineInput.trim() && onInlineGenerate) {
                e.preventDefault();
                onInlineGenerate(inlineInput, editorRef.current?.getSelection());
                setInlineOpen(false);
                setInlineInput('');
              }
            }}
          />
        </div>
      )}

      <div ref={containerRef} style={{width:'100%', height:'100%', minHeight:300, flex:1}} />
    </div>
  );
}

// ── Diff viewer (Monaco diff editor) ─────────────────────────
function DiffViewer({ fileName, original, modified, onAccept, onReject, onClose }) {
  const containerRef = React.useRef(null);
  const diffEditorRef = React.useRef(null);

  React.useEffect(() => {
    ensureMonaco(() => {
      if (!containerRef.current) return;
      const originalModel  = window.monaco.editor.createModel(original  || '', getMonacoLanguage(fileName));
      const modifiedModel  = window.monaco.editor.createModel(modified  || '', getMonacoLanguage(fileName));
      const diffEditor = window.monaco.editor.createDiffEditor(containerRef.current, {
        theme: 'maxwell-dark',
        fontSize: 13,
        fontFamily: "'JetBrains Mono', monospace",
        readOnly: true,
        renderSideBySide: true,
        ignoreTrimWhitespace: false,
        scrollBeyondLastLine: false,
        minimap: { enabled: false },
      });
      diffEditor.setModel({ original: originalModel, modified: modifiedModel });
      diffEditorRef.current = diffEditor;
    });
    return () => { if (diffEditorRef.current) diffEditorRef.current.dispose(); };
  }, [fileName, original, modified]);

  return (
    <div className="diff-overlay" onClick={onClose}>
      <div className="diff-box" onClick={e=>e.stopPropagation()}>
        <div className="diff-header">
          <span style={{display:'flex'}}>{ICONS.diff}</span>
          <span className="diff-title">Diff — {fileName}</span>
          <div style={{fontSize:11,color:'var(--muted)',display:'flex',gap:12}}>
            <span style={{color:'var(--red)'}}>─ original</span>
            <span style={{color:'var(--green)'}}>+ proposed</span>
          </div>
          <div className="diff-actions">
            <button className="cb-accept-all" onClick={onAccept}>Accept</button>
            <button className="cb-reject-all" onClick={onReject}>Reject</button>
            <button className="sb-icon-btn" onClick={onClose} style={{display:'flex'}}>{ICONS.close}</button>
          </div>
        </div>
        <div className="diff-body" ref={containerRef}/>
      </div>
    </div>
  );
}

function isPreviewBuildIntent(text='') {

function slugifyPreviewName(text='') {
  const base = text
    .toLowerCase()
    .replace(/gray matter network|gmn/g, 'gray-matter-network')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')

}

function chooseStevePreviewTemplate(text='') {
  const t = text.toLowerCase();
  if (/gray matter|gmn|network|node|portal/.test(t)) return 'gmn-network';
  if (/portfolio|gallery|artist|art|studio/.test(t)) return 'portfolio';
  if (/docs|documentation|manual|guide|wiki/.test(t)) return 'docs';
  if (/community|members|forum|social/.test(t)) return 'community';

function inferSteveBuilderMode(text='', hasSource=false) {
  const t = text.toLowerCase();
  if (/publish|ship|host|gmn|deploy|go live/.test(t)) return 'Publish Prep';
  if (/error|bug|broken|crash|doesn.t work|fix|debug/.test(t)) return 'Debug';
  if (/refine|improve|polish|make it|change|adjust|better/.test(t) && hasSource) return 'Refine';

function normalizeSteveBuilderReply(data) {
  if (typeof data === 'string') {
    try { return normalizeSteveBuilderReply(JSON.parse(data)); } catch { return { text:data, files:[] }; }
  }
  const text = data?.reply || data?.response || data?.message || data?.result || data?.synthesis || data?.verdict || data?.error || '';
  const files = []
    .concat(Array.isArray(data?.files) ? data.files : [])
    .concat(Array.isArray(data?.updatedFiles) ? data.updatedFiles : [])
    .concat(Array.isArray(data?.artifacts) ? data.artifacts : [])
    .filter(f => f && (f.content || f.body) && (f.path || f.filePath || f.name))
    .map(f => ({ path:f.path || f.filePath || f.name, content:f.content || f.body }));
  return { text: text || JSON.stringify(data), files };
}

function analyzePreviewForSteve({ activeTab, activeTabPath, fileContents }) {
  const path = activeTabPath || activeTab || '';
  const code = fileContents[path] ?? fileContents[activeTab] ?? DEMO_FILE_CONTENTS[activeTab] ?? '';
  const notes = [];
  const lowerPath = path.toLowerCase();
  const ext = (lowerPath.split('.').pop() || '').toLowerCase();
  const lineCount = typeof code === 'string' && code ? code.split('\n').length : 0;

  if (!code || code.startsWith('__IMAGE__')) {
    return [{ severity:'ok', text:'Builder mode ready. Tell Steve what to build and he will create a preview file from a starter template.' }];
  }

  [
    ['{', '}', 'brace'],
    ['(', ')', 'parenthesis'],
    ['[', ']', 'bracket']
  ].forEach(([open, close, label]) => {
    const opens = (code.match(new RegExp('\\' + open, 'g')) || []).length;
    const closes = (code.match(new RegExp('\\' + close, 'g')) || []).length;
    if (opens !== closes) notes.push({ severity:'issue', text:`Possible unmatched ${label}: ${opens} open, ${closes} close.` });
  });

  if (/[=:]\s*(undefined|null)\b/.test(code)) {
    notes.push({ severity:'warn', text:'Explicit null or undefined assignment found. Check whether the preview can render before data arrives.' });
  }
  if (/\bTODO\b|\bFIXME\b|throw new Error\(['"]not implemented/i.test(code)) {
    notes.push({ severity:'warn', text:'Unfinished implementation text found. It may leak into the preview path.' });
  }
  if ((ext === 'html' || ext === 'htm') && !/<title>[^<]{3,}<\/title>/i.test(code)) {
    notes.push({ severity:'warn', text:'Missing useful document title. Add it before GMN publish.' });
  }
  if ((ext === 'html' || ext === 'htm') && !/<meta[^>]+name=["']viewport["']/i.test(code)) {
    notes.push({ severity:'issue', text:'Missing viewport meta tag. Mobile preview will not be trustworthy.' });
  }
  if ((ext === 'html' || ext === 'htm') && /<script[^>]+src=["']https?:\/\//i.test(code)) {
    notes.push({ severity:'issue', text:'External script detected. GMN phase-one security blocks this.' });
  }
  if ((ext === 'jsx' || ext === 'tsx' || ext === 'html') && /<img\b(?![^>]*\balt=)/i.test(code)) {
    notes.push({ severity:'issue', text:'Image without alt text detected. Add accessible copy before shipping.' });
  }
  if ((ext === 'jsx' || ext === 'tsx') && /onClick=/.test(code) && !/onKeyDown=|role=['"]button|<button\b/.test(code)) {
    notes.push({ severity:'warn', text:'Clickable UI may need keyboard handling. Check interactive elements in the preview.' });
  }
  if ((ext === 'css' || ext === 'scss') && /!important/.test(code)) {
    notes.push({ severity:'warn', text:'CSS uses !important. It can mask layout bugs in responsive preview checks.' });
  }
  if (lineCount > 450) {
    notes.push({ severity:'warn', text:`This file is ${lineCount} lines. Split it before it becomes hard to reason about.` });
  }

  if (!notes.length) {
    notes.push({ severity:'ok', text:`Preview scan clean for ${path || activeTab}. Syntax balance and common UI issues look stable.` });
  }
  return notes.slice(0, 4);
}

// ── Dependency Graph panel ────────────────────────────────────────────────
function DependencyGraph({ connected, maxUrl, onOpenFile }) {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [err, setErr] = React.useState(null);
  const [selected, setSelected] = React.useState(null);
  const svgRef = React.useRef(null);
  const posRef = React.useRef({});

  const load = async () => {
    if (!connected) return;
    setLoading(true); setErr(null);
    try {
      const r = await fetch(`${maxUrl}/api/graph`);
      if (!r.ok) throw new Error(await r.text());
      const d = await r.json();
      // Assign initial positions (simple circle layout)
      const positions = {};
      d.nodes.forEach((n, i) => {
        const angle = (i / d.nodes.length) * Math.PI * 2;
        const r2 = Math.min(90, 20 + d.nodes.length * 4);
        positions[n.id] = { x: 110 + Math.cos(angle) * r2, y: 110 + Math.sin(angle) * r2 };
      });
      posRef.current = positions;
      setData(d);
    } catch(e) { setErr(e.message); }
    setLoading(false);
  };

  React.useEffect(() => { load(); }, [connected]);

  const dragRef = React.useRef(null);

  const handleMouseDown = (e, id) => {
    e.stopPropagation();
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    dragRef.current = { id, ox: svgP.x - posRef.current[id].x, oy: svgP.y - posRef.current[id].y };
  };

  const handleMouseMove = (e) => {
    if (!dragRef.current) return;
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    const { id, ox, oy } = dragRef.current;
    posRef.current[id] = { x: svgP.x - ox, y: svgP.y - oy };
    setData(d => d ? { ...d } : d); // force re-render
  };

  const handleMouseUp = () => { dragRef.current = null; };

  if (!connected) return <div style={{padding:'24px 12px',textAlign:'center',fontSize:12,color:'var(--muted)'}}>Connect to SOMA to view graph.</div>;
  if (loading) return <div style={{padding:'24px 12px',textAlign:'center',fontSize:12,color:'var(--muted)'}}>Scanning imports…</div>;
  if (err) return <div style={{padding:'16px 12px',fontSize:11,color:'var(--red)'}}>{err}</div>;
  if (!data) return <div style={{padding:'16px 12px',fontSize:12,color:'var(--muted)',textAlign:'center'}}>
    <button onClick={load} style={{background:'var(--accent)',border:'none',borderRadius:4,color:'#fff',padding:'4px 10px',cursor:'pointer',fontSize:12}}>Build Graph</button>
  </div>;

  const nodeMap = {};
  data.nodes.forEach(n => { nodeMap[n.id] = n; });
  const selNode = selected ? nodeMap[selected] : null;
  const selEdges = selected ? data.edges.filter(e => e.source===selected || e.target===selected) : [];

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div className="sb-header">
        <span>Dependency Graph</span>
        <div style={{display:'flex',gap:4}}>
          <span style={{fontSize:10,color:'var(--muted)'}}>{data.nodes.length} files · {data.edges.length} links</span>
          <button className="sb-icon-btn" onClick={load} title="Refresh">{ICONS.reload}</button>
        </div>
      </div>
      <div style={{flex:1,overflow:'hidden',position:'relative',background:'var(--bg2)'}}>
        <svg ref={svgRef} width="100%" height="100%" viewBox="0 0 220 220"
          onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}
          style={{cursor:'default'}}>
          <defs>
            <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
              <polygon points="0 0, 6 2, 0 4" fill="var(--muted)" opacity="0.5"/>
            </marker>
          </defs>
          {data.edges.map((e,i) => {
            const s = posRef.current[e.source];
            const t = posRef.current[e.target];
            if (!s || !t) return null;
            const isHighlit = selected && (e.source===selected || e.target===selected);
            return <line key={i} x1={s.x} y1={s.y} x2={t.x} y2={t.y}
              stroke={isHighlit?'var(--accent)':'var(--border)'} strokeWidth={isHighlit?1.5:0.8}
              opacity={selected&&!isHighlit?0.2:0.8} markerEnd="url(#arrowhead)"/>;
          })}
          {data.nodes.map(n => {
            const p = posRef.current[n.id];
            if (!p) return null;
            const isSel = selected===n.id;
            const isConn = selected && selEdges.some(e=>e.source===n.id||e.target===n.id);
            return (
              <g key={n.id} transform={`translate(${p.x},${p.y})`}
                onMouseDown={e=>handleMouseDown(e,n.id)}
                onClick={()=>setSelected(selected===n.id?null:n.id)}
                style={{cursor:'pointer'}}>
                <circle r={isSel?6:isConn?5:4}
                  fill={isSel?'var(--accent)':isConn?'var(--accent2)':'var(--fg)'}
                  opacity={selected&&!isSel&&!isConn?0.3:1}/>
                {(isSel||isConn||data.nodes.length<30) && (
                  <text x="0" y={isSel?-8:-7} textAnchor="middle"
                    fill={isSel?'var(--accent)':'var(--muted)'}
                    fontSize={isSel?7:5.5} opacity={selected&&!isSel&&!isConn?0.3:1}
                    style={{pointerEvents:'none',userSelect:'none'}}>
                    {n.label}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      </div>
      {selNode && (
        <div style={{borderTop:'1px solid var(--border)',padding:'8px 10px',fontSize:11,flexShrink:0}}>
          <div style={{fontWeight:600,color:'var(--fg)',marginBottom:4,cursor:'pointer',textDecoration:'underline'}}
            onClick={()=>onOpenFile(selected)}>{selNode.label}</div>
          <div style={{color:'var(--muted)',fontSize:10,marginBottom:4,wordBreak:'break-all'}}>{selected}</div>
          {selEdges.length>0&&<div style={{color:'var(--muted)',fontSize:10}}>
            {selEdges.filter(e=>e.source===selected).length} outgoing · {selEdges.filter(e=>e.target===selected).length} incoming
          </div>}
          <div style={{marginTop:6,display:'flex',flexDirection:'column',gap:2,maxHeight:80,overflowY:'auto'}}>
            {selEdges.map((e,i)=>{
              const other = e.source===selected ? e.target : e.source;
              const dir = e.source===selected ? '→' : '←';
              return <div key={i} style={{fontSize:10,color:'var(--accent)',cursor:'pointer'}}
                onClick={()=>setSelected(other)}>
                {dir} {nodeMap[other]?.label || other}
              </div>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Overview Panel ────────────────────────────────────────────
function OverviewPanel({ connected, maxUrl, goals, onStopTask, onOpenFile }) {
  const [data, setData] = React.useState({ subagents:[], filesChanged:[], artifacts:[], bgTasks:[] });
  const [open, setOpen] = React.useState({ subagents:false, files:true, artifacts:true, bg:true });

  const toggle = (k) => setOpen(p => ({ ...p, [k]: !p[k] }));

  React.useEffect(() => {
    if (!connected) return;
    let alive = true;
    const poll = async () => {
      try {
        // Subagents / active arbiters
        const popRes = await fetch(`${maxUrl}/api/population`, { headers: authHdrs(true) }).catch(() => null);
        const pop = popRes ? await popRes.json().catch(() => ({})) : {};
        const subagents = (pop.population || []).filter(a => a.status === 'active' || typeof a.status !== 'string').slice(0, 20);

        // Files changed via git
        const gitRes = await fetch(`${maxUrl}/api/tools/shell/run`, {
          method: 'POST', headers: authHdrs(),
          body: JSON.stringify({ command: 'git status --porcelain', timeoutMs: 6000 })
        }).catch(() => null);
        const gitOut = gitRes ? (await gitRes.json().catch(() => ({}))).stdout || '' : '';
        const filesChanged = gitOut.split('\n').filter(Boolean).map(l => ({
          status: l.slice(0,2).trim() || '?',
          file: l.slice(3).trim()
        }));

        // Artifacts: saved constructs + recent tool outputs
        let artifacts = [];
        try {
          const cs = JSON.parse(localStorage.getItem('pulse.constructs.v1') || '[]');
          artifacts = cs.map(c => ({ name: c.name, type: c.type || 'construct', id: c.id }));
        } catch {}

        // Background tasks from goals
        const bgTasks = (goals || []).slice(0, 10).map(g => ({ id: g.id, title: g.title, status: g.status || 'active' }));

        if (alive) setData({ subagents, filesChanged, artifacts, bgTasks });
      } catch {}
    };
    poll();
    const t = setInterval(poll, 8000);
    return () => { alive = false; clearInterval(t); };
  }, [connected, maxUrl, goals]);

  const Section = ({ k, title, items, max = 5, renderRow, emptyMsg }) => {
    const isOpen = open[k];
    const visible = isOpen ? items.slice(0, max) : [];
    const extra = items.length - max;
    return (
      <div className="ov-section">
        <div className="ov-section-hd" onClick={() => toggle(k)}>
          <span className="ov-section-title">{title}</span>
          <span className="ov-section-count">{items.length}</span>
          <span className={`ov-section-chevron ${isOpen ? 'open' : ''}`}>▶</span>
        </div>
        {isOpen && (
          <>
            {items.length === 0 && <div className="ov-empty">{emptyMsg || 'None'}</div>}
            {visible.map((item, i) => renderRow(item, i))}
            {extra > 0 && <div className="ov-see-all" onClick={() => setOpen(p => ({ ...p, [k]: true }))}>See all ({items.length})</div>}
          </>
        )}
      </div>
    );
  };

  const extIcon = (file) => {
    const ext = (file || '').split('.').pop().toLowerCase();
    const map = { js:'JS', jsx:'JSX', ts:'TS', tsx:'TSX', py:'PY', json:'{}', md:'MD', css:'CSS', html:'HTML', sh:'SH' };
    return map[ext] || '◆';
  };
  const statusColor = (s) => s === 'M' ? 'var(--amber)' : s === 'A' ? 'var(--green)' : s === 'D' ? 'var(--red)' : 'var(--muted)';

  return (
    <div className="ov-scroll">
      <Section k="subagents" title="Subagents" items={data.subagents} emptyMsg="No active subagents"
        renderRow={(a, i) => (
          <div key={i} className="ov-row">
            <span className={`ov-status-dot ${a.status === 'active' ? '' : 'idle'}`}/>
            <span className="ov-row-name">{a.name || a.id}</span>
            <span className="ov-row-sub">{a.type || 'arbiter'}</span>
          </div>
        )}
      />
      <Section k="files" title="Files Changed" items={data.filesChanged} emptyMsg="No changes"
        renderRow={(f, i) => (
          <div key={i} className="ov-row" onClick={() => onOpenFile?.(f.file)}>
            <span className="ov-row-icon" style={{fontWeight:700,fontSize:10,color:statusColor(f.status),minWidth:14}}>{f.status}</span>
            <span className="ov-row-name" title={f.file}>{f.file.split('/').pop()}</span>
            <span className="ov-row-sub">{f.file.includes('/') ? f.file.split('/').slice(0,-1).join('/') : ''}</span>
          </div>
        )}
      />
      <Section k="artifacts" title="Artifacts" items={data.artifacts} emptyMsg="No constructs yet"
        renderRow={(a, i) => (
          <div key={i} className="ov-row">
            <span className="ov-row-icon">📦</span>
            <span className="ov-row-name">{a.name}</span>
            <span className="ov-row-sub">{a.type}</span>
          </div>
        )}
      />
      <Section k="bg" title="Background Tasks" items={data.bgTasks} emptyMsg="No active tasks"
        renderRow={(t, i) => (
          <div key={i} className="ov-row">
            <span className={`ov-status-dot ${t.status === 'active' || t.status === 'running' ? '' : 'idle'}`}/>
            <span className="ov-row-name" title={t.title}>{t.title}</span>
            <button className="ov-row-stop" title="Stop task" onClick={e => { e.stopPropagation(); onStopTask?.(t.id); }}>■</button>
          </div>
        )}
      />
    </div>
  );
}

    const ws = new WebSocket(wsUrl);
    
    ws.onopen = () => console.log('[Pulse] 🌐 WebSocket active');
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'token') {
          // Token streaming handled by find-and-append to the last message with that requestId
          setMessages(m => {
            const last = m[m.length-1];
            if (last && last.role === 'max' && last.requestId === msg.requestId) {
              return [...m.slice(0, -1), { ...last, text: last.text + msg.text }];
            }
            return m;
          });
        }
        if (msg.type === 'done') {
          setIsThinking(false); setStreaming(false);
          // Refresh real usage from API instead of trusting potentially incomplete telemetry
          fetch(`${maxUrl}/api/usage`, { headers: authHdrs(true) }).then(r=>r.json()).then(u => {
            if (u.today) {
              const spent = parseFloat(u.today.totalCost?.replace('$','') || 0);
              setCredits(c => ({ ...c, used: parseFloat(spent.toFixed(4)) }));
            }
          }).catch(() => {});
        }
        if (msg.type === 'insight') {
          setInsight(msg.result || msg.text || (typeof msg.data === 'string' ? msg.data : JSON.stringify(msg)));
        }
        if (msg.type === 'status') {
          setMaxStatus(s => ({ ...s, tension: msg.drive?.tension ?? s.tension }));
        }
        if (msg.type === 'agent_say') {
          setMessages(m => [...m, { id: nextMsgId(), role: 'max', persona: 'companion', text: msg.text, modelTier: 'fast', route: 'local' }]);
        }
        if (msg.type === 'shell_output') {
          setTermLines(l => {
            const last = l[l.length - 1];
            // Append to last line if it's the same type (streaming effect)
            if (last && last.type === (msg.isError ? 'err' : 'out')) {
              return [...l.slice(0, -1), { ...last, text: last.text + msg.text }];
            }
            return [...l, { id: Math.random(), type: msg.isError ? 'err' : 'out', text: msg.text }];
          });
          setTermRunning(false);
        }
      } catch (err) { console.warn('[WS] Message error:', err); }
    };
    ws.onclose = () => console.warn('[WS] Closed');
    socketRef.current = ws;
    return () => ws.close();
  }, [connected, apiKey, maxUrl]);
  const [gitChangedCount, setGitChangedCount] = useState(0);
  const [openTabs, setOpenTabs]     = useState(()=>{ try{ const t=JSON.parse(localStorage.getItem('pulse_open_tabs')||'[]'); return Array.isArray(t)?t.filter(x=>x&&typeof x.name==='string'&&x.name.trim()):[];}catch{return [];} });

    const timer = setTimeout(() => {

  // Auto-scroll terminal
  useEffect(()=>{
    if(termBodyRef.current) termBodyRef.current.scrollTop = termBodyRef.current.scrollHeight;
  }, [termLines]);

  // Global keyboard shortcuts
  useEffect(()=>{
    const handler = e => {
      const ctrl = e.metaKey||e.ctrlKey;
      if(e.key==='?') { 
        const tag = e.target.tagName.toLowerCase();
        if(tag!=='input'&&tag!=='textarea') { e.preventDefault(); setShowShortcuts(s=>!s); }
      }
      if(ctrl&&e.key==='b') { e.preventDefault(); setSidebarOpen(s=>!s); }
      if(ctrl&&e.key==='j') { e.preventDefault(); setShowBottom(s=>!s); }
      if(ctrl&&e.shiftKey&&e.key==='S') { e.preventDefault(); setChatMode(m=>m==='swarm'?null:'swarm'); }
      if(ctrl&&e.key==='Enter') { e.preventDefault(); acceptAllPendingChanges(); }
      if(ctrl&&e.key==='Backspace') { e.preventDefault(); rejectAllPendingChanges(); }
      if(e.key==='Escape') { setShowShortcuts(false); setShowDiff(null); setShowHistory(false); }
    };
    window.addEventListener('keydown', handler);
    return ()=>window.removeEventListener('keydown', handler);
  }, [pendingChanges, activeTabPath, activeTab, maxUrl]);

  // Ctrl+K / Cmd+K palette
  useEffect(()=>{
    const handler = e => {
      if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); setShowPalette(p=>!p); }
      if ((e.metaKey||e.ctrlKey) && e.key==='p') { e.preventDefault(); document.dispatchEvent(new CustomEvent('pulse-cmd-palette', { detail: '@' })); }
      if (e.key==='Escape') setShowPalette(false);

    window.addEventListener('keydown', handler);
    return ()=>window.removeEventListener('keydown', handler);

  useEffect(() => {

  }, []);
  const inputRef = useRef(null);
  const sseRef = useRef(null);
  const bottomDragY = useRef(0);
  const bottomDragH = useRef(0);

  const handleAcceptPendingChange = async (pending) => {
    if (!pending) return;
    setPendingChanges(ps => ps.map(p => p.id === pending.id ? {...p, status:'accepting'} : p));
    playAccept();
    const fname = pending.file.split('/').pop();
    try {
      const finalContent = pending.currentOriginalContent ?? pending.content ?? '';
      await fetch(maxUrl + '/api/tools/file/write', {
        method: 'POST', headers: authHdrs(),
        body: JSON.stringify({ filePath: pending.file, content: finalContent })

    } catch (e) {
      setPendingChanges(ps => ps.map(p => p.id === pending.id ? {...p, status:'accepted'} : p));
    }
  };

  const handleRejectPendingChange = (pending) => {
    if (!pending) return;
    playReject();
    setPendingChanges(ps => ps.map(p => p.id === pending.id ? {...p, status:'rejected'} : p));
  };

  const acceptAllPendingChanges = () => {
    const pending = pendingChanges.filter(p => p.status === 'pending');
    pending.forEach(p => handleAcceptPendingChange(p));
  };

  const rejectAllPendingChanges = () => {
    const pending = pendingChanges.filter(p => p.status === 'pending');
    pending.forEach(p => handleRejectPendingChange(p));
  };

  // Expose globals for ToolChip
  useEffect(()=>{ window.SOMA_URL = maxUrl; }, [maxUrl]);
  useEffect(()=>{ window.__showDiff = (opts)=>setShowDiff(opts); }, []);

  // ── Session persistence ──────────────────────────────────────
  useEffect(()=>{
    if(messages.length>1) localStorage.setItem('mx_messages', JSON.stringify(messages.filter(m=>!m.streaming).slice(-100)));
  }, [messages]);
  useEffect(()=>{
    if(steveMessages.length>1) localStorage.setItem('mx_steve_messages', JSON.stringify(steveMessages.filter(m=>!m.streaming&&!m.stevePending).slice(-80)));
  }, [steveMessages]);
  useEffect(()=>{ localStorage.setItem('pulse_open_tabs', JSON.stringify(openTabs)); }, [openTabs]);
  useEffect(()=>{ if(activeTab && activeTab.trim()) localStorage.setItem('pulse_active_tab', activeTab); else localStorage.removeItem('pulse_active_tab'); }, [activeTab]);

  // Fetch git branch when connected

  const triggerSteveGenerate = async (brief) => {
    const siteName = slugifyPreviewName(brief.name || brief.displayName || brief.purpose || 'my-site');
    setSteveBuildState('generating');
    setSteveBuildSiteName(siteName);
    const buildMsgId = nextMsgId();
    setSteveMessages(m => [...m, {
      id: buildMsgId, role: 'max', persona: 'grinder', modelTier: 'cloud', route: 'cloud',
      text: `Building **${brief.displayName || brief.name}**… generating GMN-compliant HTML`,
      stevePending: true
    }]);
    const base = localStorage.getItem('pulse_soma_url') || '';
    let html = '';
    try {
      const r = await fetch(`${base}/api/gmn/generate-site`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          brief: brief.fullBrief || `${brief.purpose}. Style: ${brief.style || 'clean and modern'}.`,
          name: brief.displayName || brief.name,
          siteName,
          type: 'gmn-site'
        })
      });
      if (!r.ok || !r.body) throw new Error('generate-site unavailable');
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          try {
            const ev = JSON.parse(line.slice(5).trim());
            if (ev.stage === 'generating') {
              setSteveMessages(m => m.map(msg => msg.id === buildMsgId
                ? { ...msg, text: `Building **${brief.displayName || brief.name}**… ${ev.message || 'generating…'}` } : msg));
            }
            if (ev.stage === 'complete' && ev.html) html = ev.html;
          } catch {}
        }
      }
    } catch (err) {
      setSteveMessages(m => m.map(msg => msg.id === buildMsgId
        ? { ...msg, stevePending: false, text: `Generation failed: ${err.message}. Tell me to try again.` } : msg));
      setSteveBuildState(null);
      return;
    }
    if (!html) {
      setSteveMessages(m => m.map(msg => msg.id === buildMsgId
        ? { ...msg, stevePending: false, text: 'Got empty HTML back. Something went wrong on the backend — try again.' } : msg));
      setSteveBuildState(null);
      return;
    }
    const sizeKb = Math.round(html.length / 1024);
    const externalScripts = (html.match(/<script\s+src=/gi)||[]).length;
    const externalCss = (html.match(/<link[^>]+rel=["']stylesheet/gi)||[]).length;
    const externalUrls = (html.match(/https?:\/\/[^\s"']+\.(css|js)/g)||[]).length;
    const externalCount = Math.max(externalScripts + externalCss, externalUrls);
    const loadEst = sizeKb < 10 ? '<50ms' : sizeKb < 50 ? '~150ms' : sizeKb < 200 ? '~400ms' : '>1s';
    const qualityLine = externalCount === 0
      ? `✓ GMN-compliant · ${sizeKb}KB · est. ${loadEst}`
      : `⚠ ${externalCount} external ref${externalCount>1?'s':''} · ${sizeKb}KB · est. ${loadEst}`;
    const filePath = `gmn/${siteName}/index.html`;
    stageStevePreviewFile(filePath, html);
    setSteveBuildState('ready');
    setSteveMessages(m => m.map(msg => msg.id === buildMsgId ? {
      ...msg, stevePending: false,
      text: `Done. **${brief.displayName || brief.name}** is staged in preview.\n↳ ${qualityLine}\n\nRefine it here — just tell me what to change. Hit **Publish to Portal** when it's ready.`,

      const r = await fetch(`${maxUrl}/api/tools/shell/run`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command:'npx tsc --noEmit 2>&1', timeoutMs:30000 })
      });
      const d = await r.json();
      const raw = (d.stdout||d.output||d.result||d.stderr||'').trim();
      if (!raw || raw.includes('not found') || raw.includes('command not found')) {
        setProblemLines([{type:'info',text:'No tsconfig.json found — TypeScript check skipped'}]);
        setProblemCount(0); return;
      }
      const lines = raw.split('\n').filter(Boolean);
      // tsc error lines look like: src/foo.ts(12,5): error TS2345: ...
      const errRe = /^(.+)\((\d+),(\d+)\):\s*(error|warning)\s+(TS\d+):\s*(.+)$/;
      const parsed = lines.map(l => {
        const m = l.match(errRe);
        if (m) return { type: m[4]==='error'?'err':'info', file:m[1], line:m[2], col:m[3], code:m[5], msg:m[6], text:`${m[1]}:${m[2]} — ${m[6]}` };
        return { type:'out', text:l };
      });
      const errCount = parsed.filter(p=>p.type==='err').length;
      setProblemLines(parsed);
      setProblemCount(errCount);
    } catch(e) {
      setProblemLines([{type:'err',text:'Failed to run check: '+e.message}]);
    }
  }, [maxUrl]);

  // ── File system API ──────────────────────────────────────
  const listFiles = React.useCallback(async (dir='.') => {
    try {
      const r = await fetch(`${maxUrl}/api/files/tree?dir=${encodeURIComponent(dir)}`, {
        headers: authHdrs(true)
      });
      const d = await r.json();
      const raw = d.files || d.result || [];
      return Array.isArray(raw) ? raw : [];
    } catch { return null; }
  }, [maxUrl]);

  const readFile2 = React.useCallback(async (filePath) => {
    if (fileContents[filePath] !== undefined) return fileContents[filePath];
    try {
      const r = await fetch(maxUrl+'/api/tools/file/read', {
        method:'POST', headers: authHdrs(),
        body: JSON.stringify({ filePath })
      });
      const d = await r.json();
      const content = d.content || d.result || d.text || '';
      setFileContents(c => ({...c, [filePath]: content}));
      return content;
    } catch { return null; }
  }, [maxUrl, fileContents]);

  const saveFile2 = React.useCallback(async (filePath, content) => {
    setSaveStatus('saving');
    try {
      await fetch(maxUrl+'/api/tools/file/write', {
        method:'POST', headers: authHdrs(),
        body: JSON.stringify({ filePath, content })
      });
      const tabName = filePath.split('/').pop();
      setUnsaved(u => ({...u, [tabName]: false}));
      setFileContents(c => ({...c, [filePath]: content}));
      setSaveStatus('saved');
      setTimeout(() => setSaveStatus(''), 2000);
    } catch {
      setSaveStatus('');
    }
  }, [maxUrl]);

  const handleEditorChange = React.useCallback((filePath, newContent) => {
    const tabName = filePath.split('/').pop();
    setFileContents(c => ({...c, [filePath]: newContent}));
    setUnsaved(u => ({...u, [tabName]: true}));
    // Debounced auto-save (2s)
    if (connected) {
      clearTimeout(saveTimers.current[filePath]);
      saveTimers.current[filePath] = setTimeout(() => saveFile2(filePath, newContent), 2000);
    }
  }, [connected, saveFile2]);

  // Ctrl+S manual save
